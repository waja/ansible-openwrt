# playbooks/site.yml
---
- name: Configure OpenWrt network before package operations
  hosts: openwrt
  gather_facts: false
  roles:
    - role: router_network
      tags:
        - router_network

- name: Initialize and configure OpenWrt routers
  hosts: openwrt
  gather_facts: false
  roles:
    - role: community.openwrt.init
      tags:
        - always
    - role: router_system
      tags:
        - router_system
    - role: router_firewall
      tags:
        - router_firewall
    - role: router_packages
      tags:
        - router_packages
      vars:
        router_packages_managed_services: "{{ router_base_services }}"
    - role: router_base
      tags:
        - router_base
    - role: router_snmpd
      tags:
        - router_snmpd
      when: router_snmpd_enabled | bool
    - role: router_librenms
      tags:
        - router_librenms
      when: router_librenms_enabled | bool
