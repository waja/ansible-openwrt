# playbooks/site.yml
---
- name: Configure OpenWrt network before package operations
  hosts: openwrt
  gather_facts: false
  roles:
    - router_network

- name: Initialize and configure OpenWrt routers
  hosts: openwrt
  gather_facts: false
  roles:
    - community.openwrt.init
    - router_system
    - router_firewall
    - role: router_packages
      vars:
        router_packages_managed_services: "{{ router_base_services }}"
    - router_base
