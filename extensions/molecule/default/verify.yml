# extensions/molecule/default/verify.yml
---
- name: Verify declarative firewall zone updates and validation
  hosts: all
  gather_facts: false
  tasks:
    - name: Update one managed firewall zone option
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_input: ACCEPT
        router_firewall_forward: ACCEPT
        router_firewall_output: ACCEPT
        router_firewall_apply_runtime_changes: false
        router_firewall_dropbear_extra_ports:
          - 2222
          - 2223
        router_firewall_dropbear_wan_zone: wan
        router_firewall_zones:
          guest_test:
            input: DROP

    - name: Read updated firewall zone policy
      community.openwrt.uci:
        command: get
        key: firewall.guest_test.input
      register: router_firewall_updated_input
      changed_when: false

    - name: Read preserved firewall zone network
      community.openwrt.uci:
        command: get
        key: firewall.guest_test.network
      register: router_firewall_preserved_network
      changed_when: false

    - name: Verify zone updates preserve omitted options
      ansible.builtin.assert:
        that:
          - router_firewall_updated_input.result == 'DROP'
          - router_firewall_preserved_network.result == 'lan'

    - name: Remove explicitly null options from a named firewall zone
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          guest_test:
            network: null
            input: null
            masq: null
            mtu_fix: null
            masq_src: null
            masq_dest: null
            masq_allow_invalid: null
            log: null
            log_limit: null
            helper: null

    - name: Read firewall configuration after explicit null removals
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_null_options_show
      changed_when: false

    - name: Verify null removals are persisted to the firewall file
      ansible.builtin.raw: |
        zone_config="$(sed -n \
          "/^config zone 'guest_test'$/,/^config /p" /etc/config/firewall)"
        for option in network input masq mtu_fix masq_src masq_dest \
          masq_allow_invalid log log_limit helper; do
          if printf '%s\n' "$zone_config" | \
            grep -E "^[[:space:]]*(option|list) $option "; then
            echo "Explicitly null firewall option remains persisted: $option"
            exit 1
          fi
        done
      changed_when: false

    - name: Verify null removes every explicitly cleared zone option
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_null_options_show.result
            is not search(
              "firewall\\.guest_test\\."
              ~ "(network|input|masq|mtu_fix|masq_src|masq_dest|"
              ~ "masq_allow_invalid|log|log_limit|helper)="
            )

    - name: Test explicit false firewall zone options
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          guest_test:
            enabled: false
            masq: false
            masq6: false
            masq_allow_invalid: false
            mtu_fix: false
            auto_helper: true
            counter: false

    - name: Read explicit firewall zone boolean values through UCI
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_boolean_values
      changed_when: false

    - name: Verify explicit false values are persisted as zero
      ansible.builtin.assert:
        that:
          - >-
              "firewall.guest_test.enabled='0'"
              in router_firewall_boolean_values.result
          - >-
              "firewall.guest_test.masq='0'"
              in router_firewall_boolean_values.result
          - >-
              "firewall.guest_test.masq6='0'"
              in router_firewall_boolean_values.result
          - >-
              "firewall.guest_test.masq_allow_invalid='0'"
              in router_firewall_boolean_values.result
          - >-
              "firewall.guest_test.mtu_fix='0'"
              in router_firewall_boolean_values.result
          - >-
              "firewall.guest_test.auto_helper='1'"
              in router_firewall_boolean_values.result
          - >-
              "firewall.guest_test.counter='0'"
              in router_firewall_boolean_values.result

    - name: Verify explicit boolean values are persisted to the firewall file
      ansible.builtin.raw: |
        zone_config="$(sed -n \
          "/^config zone 'guest_test'$/,/^config /p" /etc/config/firewall)"
        for option in enabled masq masq6 masq_allow_invalid mtu_fix counter; do
          printf '%s\n' "$zone_config" | \
            grep -F "option $option '0'" >/dev/null || {
              echo "Missing persisted false firewall option: $option"
              exit 1
            }
        done
        printf '%s\n' "$zone_config" | \
          grep -F "option auto_helper '1'" >/dev/null || {
            echo "Missing persisted true auto_helper option"
            exit 1
          }
      changed_when: false

    - name: Verify explicit boolean values are committed
      ansible.builtin.raw: |
        test -z "$(uci changes firewall)" || {
          echo "Uncommitted changes remain in firewall UCI configuration"
          exit 1
        }
      changed_when: false

    - name: Capture empty firewall zone list validation
      block:
        - name: Attempt to configure an empty network list
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              empty_lst:
                network: []
      rescue:
        - name: Record the empty list validation failure
          ansible.builtin.set_fact:
            router_firewall_empty_list_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify empty firewall zone lists are rejected
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_empty_list_failure
            == 'Validate firewall zone option types and values'

    - name: Verify empty list validation made no UCI changes
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_empty_lst
      changed_when: false

    - name: Assert empty list input did not create a firewall zone
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_empty_lst.result
            is not search('firewall\\.empty_lst=')

    - name: Capture invalid firewall zone option type validation
      block:
        - name: Attempt to configure a boolean log value
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              invalid_log:
                log: true
      rescue:
        - name: Record the invalid log type failure
          ansible.builtin.set_fact:
            router_firewall_invalid_log_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify log requires an integer bitmask
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_invalid_log_failure
            == 'Validate firewall zone option types and values'

    - name: Capture invalid firewall log limit validation
      block:
        - name: Attempt to configure an unsupported log limit unit
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_limit:
                log_limit: 10/permonth
      rescue:
        - name: Record the invalid log limit failure
          ansible.builtin.set_fact:
            router_firewall_invalid_log_limit_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify log limits use fw4-supported units
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_invalid_log_limit_failure
            == 'Validate firewall zone option types and values'

    - name: Capture invalid firewall zone policy validation
      block:
        - name: Attempt to configure an unsupported zone policy
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_policy:
                input: ALLOW
      rescue:
        - name: Record the invalid policy validation failure
          ansible.builtin.set_fact:
            router_firewall_bad_policy_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify unsupported zone policies are rejected
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_policy_failure
            == 'Validate firewall zone option types and values'

    - name: Capture invalid firewall zone family validation
      block:
        - name: Attempt to configure an unsupported zone family
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_family:
                family: ipv5
      rescue:
        - name: Record the invalid family validation failure
          ansible.builtin.set_fact:
            router_firewall_bad_family_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify unsupported zone families are rejected
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_family_failure
            == 'Validate firewall zone option types and values'

    - name: Capture invalid firewall zone list item validation
      block:
        - name: Attempt to configure a non-string zone list item
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_list:
                device:
                  - true
      rescue:
        - name: Record the invalid list item validation failure
          ansible.builtin.set_fact:
            router_firewall_bad_list_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify zone lists reject non-string items
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_list_failure
            == 'Validate firewall zone option types and values'

    - name: Capture mapping input for a list-valued zone option
      block:
        - name: Attempt to configure a mapping as a network list
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_mapping:
                network:
                  lan: true
      rescue:
        - name: Record mapping validation failure
          ansible.builtin.set_fact:
            router_firewall_bad_mapping_failure: >-
              {{ ansible_failed_task.name }}

    - name: Assert mappings are rejected as zone lists
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_mapping_failure
            == 'Validate firewall zone option types and values'

    - name: Capture empty string item in a zone list
      block:
        - name: Attempt to configure an empty device name
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              empty_item:
                device:
                  - ""
      rescue:
        - name: Record empty item validation failure
          ansible.builtin.set_fact:
            router_firewall_empty_item_failure: >-
              {{ ansible_failed_task.name }}

    - name: Assert empty strings are rejected in zone lists
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_empty_item_failure
            == 'Validate firewall zone option types and values'

    - name: Capture unsupported firewall log bits
      block:
        - name: Attempt to configure an unsupported log bit
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_bits:
                log: 4
      rescue:
        - name: Record unsupported log bit validation failure
          ansible.builtin.set_fact:
            router_firewall_bad_bits_failure: >-
              {{ ansible_failed_task.name }}

    - name: Assert unsupported firewall log bits are rejected
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_bits_failure
            == 'Validate firewall zone option types and values'

    - name: Create an anonymous duplicate for named-section precedence
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: guest_test
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan

    - name: >-
        Reapply the existing named zone in the presence of an anonymous
        duplicate
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          guest_test:
            input: DROP

    - name: Verify the named zone remains authoritative
      community.openwrt.uci:
        command: get
        key: firewall.guest_test.input
      register: router_firewall_named_precedence
      changed_when: false

    - name: Find the anonymous duplicate that must remain untouched
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: zone
        option: name
        find: guest_test
      register: router_firewall_named_precedence_matches
      changed_when: false

    - name: Read firewall UCI output after named-section precedence check
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_named_precedence_show
      changed_when: false

    - name: Assert named-section precedence
      ansible.builtin.assert:
        that:
          - router_firewall_named_precedence.result == 'DROP'
          - router_firewall_named_precedence_matches.result_list | length == 2
          - >-
            router_firewall_named_precedence_show.result
            is search("firewall\\.@zone\\[[0-9]+\\]\\.name='guest_test'")

    - name: Create an anonymous zone with an option to remove
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: null_anon
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan
          - command: add_list
            key: firewall.@zone[-1].masq_src
            value: 192.0.2.0/24

    - name: Adopt anonymous zone and remove its explicitly null option
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          null_anon:
            masq_src: null

    - name: Find the adopted anonymous firewall zone
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: zone
        option: name
        find: null_anon
      register: router_firewall_anonymous_null_matches
      changed_when: false

    - name: Read firewall configuration after anonymous option removal
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_anonymous_null_show
      changed_when: false

    - name: Assert the adopted anonymous zone option was removed
      ansible.builtin.assert:
        that:
          - router_firewall_anonymous_null_matches.result_list | length == 1
          - >-
            (
              'firewall.'
              ~ router_firewall_anonymous_null_matches.result_list[0]
              ~ '.masq_src='
            ) not in router_firewall_anonymous_null_show.result

    - name: Create anonymous zones for ordered removal and null cleanup
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: drop_first
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: keep_second
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan
          - command: add_list
            key: firewall.@zone[-1].masq_src
            value: 192.0.2.0/24

    - name: Remove an earlier anonymous zone before clearing a later zone option
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          drop_first:
            state: absent
          keep_second:
            masq_src: null

    - name: Find the anonymous zone that was updated after the removal
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: zone
        option: name
        find: keep_second
      register: router_firewall_shifted_zone
      changed_when: false

    - name: Read firewall configuration after ordered anonymous changes
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_shifted_zone_show
      changed_when: false

    - name: Assert the later anonymous zone was targeted by stable identity
      ansible.builtin.assert:
        that:
          - router_firewall_shifted_zone.result_list | length == 1
          - >-
            (
              'firewall.'
              ~ router_firewall_shifted_zone.result_list[0]
              ~ '.masq_src='
            ) not in router_firewall_shifted_zone_show.result
          - >-
            router_firewall_shifted_zone_show.result
            is not search("firewall\\.@zone\\[[0-9]+\\]\\.name='drop_first'")

    - name: Create two anonymous zones with an ambiguous name
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: ambig_test
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: ambig_test
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan

    - name: Capture ambiguous anonymous zone validation
      block:
        - name: Attempt to adopt an ambiguous anonymous firewall zone
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              ambig_test:
                network:
                  - lan
      rescue:
        - name: Record the ambiguous zone validation failure
          ansible.builtin.set_fact:
            router_firewall_ambiguous_zone_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify ambiguous anonymous zones fail during validation
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_ambiguous_zone_failure
            == 'Reject ambiguous anonymous firewall zone matches'

    - name: Verify ambiguous input did not create a named section
      community.openwrt.uci:
        command: get
        key: firewall.ambig_test
      register: router_firewall_ambiguous_named_zone
      changed_when: false
      failed_when: false

    - name: Verify both ambiguous anonymous sections remain
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: zone
        option: name
        find: ambig_test
      register: router_firewall_ambiguous_matches
      changed_when: false

    - name: Assert ambiguous configuration remains unchanged
      ansible.builtin.assert:
        that:
          - router_firewall_ambiguous_named_zone.result | default('') == ''
          - router_firewall_ambiguous_matches.result_list | length == 2

    - name: Capture invalid firewall zone option validation
      block:
        - name: Attempt to configure a zone with an invalid boolean
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_bool:
                masq: "false"
      rescue:
        - name: Record the invalid zone validation failure
          ansible.builtin.set_fact:
            router_firewall_bad_bool_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify invalid zone options fail during validation
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_bool_failure
            == 'Validate firewall zone option types and values'

    - name: Check that invalid zone input did not create a section
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_bad_bool
      changed_when: false

    - name: Assert invalid zone input left the firewall unchanged
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_bad_bool.result
            is not search('firewall\\.bad_bool=')

    - name: Create a zone for successful removal
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          remove_test:
            network:
              - lan

    - name: Remove an unreferenced named firewall zone
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          remove_test:
            state: absent

    - name: Verify the named firewall zone was removed
      community.openwrt.uci:
        command: get
        key: firewall.remove_test
      register: router_firewall_removed_zone
      changed_when: false
      failed_when: false

    - name: Assert the named firewall zone is absent
      ansible.builtin.assert:
        that:
          - router_firewall_removed_zone.result | default('') == ''

    - name: Verify removal is idempotent
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          remove_test:
            state: absent

    - name: Create an anonymous zone for successful removal
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: remove_anon
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan

    - name: Remove an adopted anonymous firewall zone
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          remove_anon:
            state: absent

    - name: Verify the anonymous firewall zone was removed
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: zone
        option: name
        find: remove_anon
      register: router_firewall_removed_anonymous_zone
      changed_when: false

    - name: Assert the anonymous firewall zone is absent
      ansible.builtin.assert:
        that:
          - router_firewall_removed_anonymous_zone.result_list | length == 0

    - name: Create a zone and dependent firewall objects
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: ref_test
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan
          - command: section
            config: firewall
            type: rule
            name: ref_rule_test
            value:
              name: ref_rule_test
              src: ref_test
              target: ACCEPT
          - command: section
            config: firewall
            type: redirect
            name: ref_redirect_test
            value:
              name: ref_redirect_test
              src: ref_test
              dest: lan
          - command: section
            config: firewall
            type: forwarding
            name: ref_forward_test
            value:
              src: ref_test
              dest: lan

    - name: Capture reference-safe zone removal validation
      block:
        - name: Attempt to remove a referenced firewall zone
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              ref_test:
                state: absent
      rescue:
        - name: Record the referenced zone validation failure
          ansible.builtin.set_fact:
            router_firewall_referenced_zone_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify referenced zone removal was rejected
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_referenced_zone_failure
            == 'Reject removal of referenced firewall zones'

    - name: Verify the referenced zone and dependent objects remain
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_referenced_zone_show
      changed_when: false

    - name: Find the anonymous zone that must remain
      community.openwrt.uci:
        command: find_all
        config: firewall
        type: zone
        option: name
        find: ref_test
      register: router_firewall_referenced_anonymous_zone
      changed_when: false

    - name: Assert the referenced anonymous zone remains
      ansible.builtin.assert:
        that:
          - router_firewall_referenced_anonymous_zone.result_list | length == 1

    - name: Assert reference validation made no partial changes
      ansible.builtin.assert:
        that:
          - "'firewall.@zone[' in router_firewall_referenced_zone_show.result"
          - >-
            'firewall.ref_rule_test=rule'
            in router_firewall_referenced_zone_show.result
          - >-
            'firewall.ref_redirect_test=redirect'
            in router_firewall_referenced_zone_show.result
          - >-
            'firewall.ref_forward_test=forwarding'
            in router_firewall_referenced_zone_show.result

    - name: Check for staged changes after reference validation
      community.openwrt.command:
        cmd: uci changes firewall
      register: router_firewall_pending_changes
      changed_when: false

    - name: Assert reference validation left no staged changes
      ansible.builtin.assert:
        that:
          - router_firewall_pending_changes.stdout | length == 0

    - name: Verify no staged firewall UCI changes remain
      community.openwrt.command:
        cmd: uci changes firewall
      register: router_firewall_pending_changes
      changed_when: false

    - name: Assert firewall UCI changes were committed
      ansible.builtin.assert:
        that:
          - router_firewall_pending_changes.stdout | length == 0

    - name: Create unrelated firewall sections with sentinel options
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: section
            config: firewall
            type: zone
            name: unmanaged_test
            value:
              name: unmanaged_test
              network:
                - lan
              test_sentinel: keep-zone-value
          - command: section
            config: firewall
            type: rule
            name: unmanaged_rule_test
            value:
              name: unmanaged_rule_test
              src: lan
              target: ACCEPT
              test_sentinel: keep-rule-value

    - name: Update a managed firewall zone while unrelated sections exist
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          guest_test:
            input: DROP

    - name: Read firewall configuration after unrelated-section preservation test
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_unrelated_preservation
      changed_when: false

    - name: Verify unrelated firewall sections and options remain unchanged
      ansible.builtin.assert:
        that:
          - >-
            "firewall.unmanaged_test.test_sentinel='keep-zone-value'"
            in router_firewall_unrelated_preservation.result
          - >-
            "firewall.unmanaged_test.network='lan'"
            in router_firewall_unrelated_preservation.result
          - >-
            "firewall.unmanaged_rule_test.test_sentinel='keep-rule-value'"
            in router_firewall_unrelated_preservation.result
          - >-
            "firewall.unmanaged_rule_test.target='ACCEPT'"
            in router_firewall_unrelated_preservation.result

    - name: Capture scalar input for a list-valued firewall zone option
      block:
        - name: Attempt to configure network as a scalar
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_scalar_list:
                network: lan
      rescue:
        - name: Record scalar-as-list validation failure
          ansible.builtin.set_fact:
            router_firewall_scalar_list_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify scalar values are rejected for list-valued zone options
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_scalar_list_failure
            == 'Validate firewall zone option types and values'

    - name: Capture list input for a scalar firewall zone option
      block:
        - name: Attempt to configure log as a list
          ansible.builtin.include_role:
            name: router_firewall
          vars:
            router_firewall_apply_runtime_changes: false
            router_firewall_zones:
              bad_list_scalar:
                log:
                  - 1
      rescue:
        - name: Record list-as-scalar validation failure
          ansible.builtin.set_fact:
            router_firewall_list_scalar_failure: >-
              {{ ansible_failed_task.name }}

    - name: Verify list values are rejected for scalar zone options
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_list_scalar_failure
            == 'Validate firewall zone option types and values'

    - name: Verify cross-type validation made no firewall changes
      community.openwrt.uci:
        command: show
        config: firewall
      register: router_firewall_cross_type_validation
      changed_when: false

    - name: Assert invalid cross-type input did not create firewall sections
      ansible.builtin.assert:
        that:
          - >-
            router_firewall_cross_type_validation.result
            is not search('firewall\\.bad_scalar_list=')
          - >-
            router_firewall_cross_type_validation.result
            is not search('firewall\\.bad_list_scalar=')
