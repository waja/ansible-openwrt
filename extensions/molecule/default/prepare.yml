# extensions/molecule/default/prepare.yml
---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until ubus is ready
      ansible.builtin.raw: |
        test -S /var/run/ubus/ubus.sock && ubus list >/dev/null
      register: ubus_check
      until: ubus_check.rc == 0
      retries: 30
      delay: 2
      changed_when: false
