# extensions/molecule/default/prepare.yml
---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until ubus is ready
      ansible.builtin.raw: |
        test -S /var/run/ubus/ubus.sock && ubus list >/dev/null
      register: ubus_check
      until: ubus_check.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: Create an anonymous factory-style firewall zone for adoption
      community.openwrt.uci:
        autocommit: true
        operations:
          - command: add
            config: firewall
            type: zone
          - command: set
            key: firewall.@zone[-1].name
            value: guest_test
          - command: add_list
            key: firewall.@zone[-1].network
            value: lan
          - command: set
            key: firewall.@zone[-1].input
            value: REJECT
