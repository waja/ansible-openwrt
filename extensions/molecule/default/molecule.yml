# extensions/molecule/default/molecule.yml
---
driver:
  name: docker
platforms:
  # Pin stable releases so package feeds do not resolve to SNAPSHOT.
  - name: openwrt-25.12
    image: openwrt/rootfs:x86_64-25.12.6
    command: /sbin/init
    pre_build_image: true
    tmpfs:
      - /tmp:exec,mode=1777
  - name: openwrt-24.10
    image: openwrt/rootfs:x86_64-24.10.8
    # Keep Docker's IP, default route and resolver instead of letting the
    # router's default LAN setup replace them before opkg can reach its feeds.
    command: >-
      /bin/sh -c 'rm -f /etc/rc.d/S*network /etc/rc.d/S*dnsmasq
      /etc/rc.d/S*firewall /etc/rc.d/S*odhcpd; exec /sbin/init'
    # OpenWrt 24.10's procd/jail needs privileges denied by the default
    # Docker security profile when package post-install scripts start services.
    privileged: true
    security_opts:
      - seccomp=unconfined
    pre_build_image: true
    tmpfs:
      - /tmp:exec,mode=1777
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../../roles:~/.ansible/roles:/usr/share/ansible/roles
  inventory:
    group_vars:
      all:
        ansible_connection: docker
        ansible_remote_tmp: /tmp
        openwrt_remote_tmp: /tmp
