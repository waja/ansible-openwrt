# extensions/molecule/default/molecule.yml
---
driver:
  name: docker
platforms:
  # Follow the OpenWrt 25.12 series tag instead of pinning a patch release.
  - name: openwrt-25.12
    image: openwrt/rootfs:x86_64-openwrt-25.12
    command: /sbin/init
    pre_build_image: true
    tmpfs:
      - /tmp:exec,mode=1777
  # OpenWrt 24.10 is temporarily disabled; see the workflow matrix.
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ../../../roles:~/.ansible/roles:/usr/share/ansible/roles
  inventory:
    group_vars:
      all:
        ansible_connection: docker
        ansible_remote_tmp: /tmp
        openwrt_remote_tmp: /tmp
