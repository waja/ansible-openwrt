# extensions/molecule/default/molecule.yml
---
driver:
  name: docker
platforms:
  - name: openwrt-25.12
    image: openwrt/rootfs:x86-64-25.12
    command: sleep infinity
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_REMOTE_TEMP: /tmp
  inventory:
    group_vars:
      all:
        ansible_connection: docker
