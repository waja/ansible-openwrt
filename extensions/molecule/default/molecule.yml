# extensions/molecule/default/molecule.yml
---
driver:
  name: docker
platforms:
  - name: openwrt-25.12
    image: openwrt/rootfs:x86_64-openwrt-25.12
    command: /bin/sh -c "while true; do sleep 3600; done"
    pre_build_image: true
    tmpfs:
      - /tmp
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_connection: docker
        ansible_remote_tmp: /tmp
        openwrt_remote_tmp: /tmp
