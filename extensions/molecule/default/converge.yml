---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Include role community.openwrt.init
      ansible.builtin.include_role:
        name: community.openwrt.init

    - name: Apply router hostname role
      ansible.builtin.include_role:
        name: router_hostname
      vars:
        router_hostname_value: molecule-test-router

    - name: Apply router packages role
      ansible.builtin.include_role:
        name: router_packages
      vars:
        router_packages_list:
          - busybox
          - openwrt-keyring
          - snmpd
          - muninlite
          - rsync
          - uhttpd
          - uhttpd-mod-ubus
          - rpcd
          - xinetd

    - name: Apply router base role
      ansible.builtin.include_role:
        name: router_base
