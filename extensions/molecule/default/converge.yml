# extensions/molecule/default/converge.yml
---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Include role community.openwrt.init
      ansible.builtin.include_role:
        name: community.openwrt.init

    - name: Apply router system role
      ansible.builtin.include_role:
        name: router_system
      vars:
        router_system_hostname: molecule-test-router
        router_system_timezone: CET-1CEST,M3.5.0,M10.5.0/3
        router_system_timezone_name: Europe/Berlin
        router_system_ntp_enabled: false
        router_system_ntp_servers:
          - 0.example.invalid
          - 1.example.invalid
        router_system_log_proto: tcp
        router_system_conloglevel: 4
        router_system_dropbear_extra_ports:
          - 2222
          - 2223
        router_system_cronloglevel: 7
        router_system_asu_auto_search: 0
        router_system_asu_login_check_for_upgrades: 1
        router_system_asu_upgrade_packages: 1
        router_system_log_ip: 192.0.2.234

    - name: Apply router firewall role with defaults
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_input: ACCEPT
        router_firewall_forward: ACCEPT
        router_firewall_output: ACCEPT
        router_firewall_apply_runtime_changes: false
      tags:
        - molecule-idempotence-notest

    - name: Verify additional Dropbear ports are closed by default
      ansible.builtin.raw: |
        if uci -q get \
          firewall.ansible_router_firewall_dropbear_extra_wan >/dev/null; then
          echo "Unexpected additional Dropbear WAN firewall rule"
          exit 1
        fi
      changed_when: false
      tags:
        - molecule-idempotence-notest

    - name: Apply router firewall role with WAN access enabled
      ansible.builtin.include_role:
        name: router_firewall
      vars:
        router_firewall_input: ACCEPT
        router_firewall_forward: ACCEPT
        router_firewall_output: ACCEPT
        router_firewall_apply_runtime_changes: false
        router_firewall_zones:
          guest_test:
            network:
              - lan
            input: REJECT
            output: ACCEPT
            forward: REJECT
            masq: false
            mtu_fix: true
          new_guest:
            network:
              - lan
        router_firewall_dropbear_extra_ports:
          - 2222
          - 2223
        router_firewall_dropbear_wan_zone: wan

    - name: Verify firewall defaults
      ansible.builtin.raw: |
        printf 'input='; uci -q get firewall.@defaults[0].input || exit 1
        printf 'forward='; uci -q get firewall.@defaults[0].forward || exit 1
        printf 'output='; uci -q get firewall.@defaults[0].output || exit 1
        printf 'extra_rule='
        uci -q get \
          firewall.ansible_router_firewall_dropbear_extra_wan.dest_port \
          || exit 1
        printf 'zone_name='
        uci -q get firewall.guest_test.name || exit 1
        printf 'zone_network='
        uci -q get firewall.guest_test.network || exit 1
        printf 'new_zone_name='
        uci -q get firewall.new_guest.name || exit 1
        test -z "$(uci changes firewall)" || {
          echo "Uncommitted changes remain in firewall UCI configuration"
          exit 1
        }
      register: router_firewall_uci
      changed_when: false

    - name: Assert firewall defaults
      ansible.builtin.assert:
        that:
          - "'input=ACCEPT' in router_firewall_uci.stdout"
          - "'forward=ACCEPT' in router_firewall_uci.stdout"
          - "'output=ACCEPT' in router_firewall_uci.stdout"
          - "'extra_rule=2222 2223' in router_firewall_uci.stdout"
          - "'zone_name=guest_test' in router_firewall_uci.stdout"
          - "'zone_network=lan' in router_firewall_uci.stdout"
          - "'new_zone_name=new_guest' in router_firewall_uci.stdout"

    - name: Apply router packages role
      ansible.builtin.include_role:
        name: router_packages
        public: true
      vars:
        router_packages_managed_services:
          - snmpd
          - xinetd
        router_packages_list:
          - busybox
          - openwrt-keyring

    - name: Verify package list used by the package installation role
      ansible.builtin.assert:
        that:
          - >-
            router_packages_install_list ==
            ['busybox', 'openwrt-keyring', 'snmpd', 'xinetd']

    - name: Create obsolete SNMP configuration for the cleanup test
      community.openwrt.file:
        path: /etc/config/snmpd-opkg
        state: touch
      tags:
        - molecule-idempotence-notest

    - name: Apply router base role
      ansible.builtin.include_role:
        name: router_base
      vars:
        router_base_services:
          - snmpd
          - xinetd

    - name: Verify required services are enabled and running
      ansible.builtin.raw: |
        for service in snmpd xinetd; do
          /etc/init.d/"$service" enabled || exit 1
          pidof "$service" >/dev/null || exit 1
        done
      changed_when: false

    - name: Check for obsolete SNMP configuration
      community.openwrt.stat:
        path: /etc/config/snmpd-opkg
      register: router_obsolete_snmp_config

    - name: Assert obsolete SNMP configuration is absent
      ansible.builtin.assert:
        that:
          - not router_obsolete_snmp_config.stat.exists
        fail_msg: The obsolete snmpd-opkg configuration still exists.

    - name: Read configured system values
      ansible.builtin.raw: |
        printf 'hostname='; uci -q get system.@system[0].hostname || exit 1
        printf 'timezone='; uci -q get system.@system[0].timezone || exit 1
        printf 'zonename='; uci -q get system.@system[0].zonename || exit 1
        printf 'ntp_enabled='; uci -q get system.ntp.enabled || exit 1
        printf 'ntp_servers='; uci -q show system.ntp
        printf 'log_proto='; uci -q get system.@system[0].log_proto || exit 1
        printf 'conloglevel='
        uci -q get system.@system[0].conloglevel || exit 1
        printf 'cronloglevel='
        uci -q get system.@system[0].cronloglevel || exit 1
        printf 'asu_auto_search='
        uci -q get attendedsysupgrade.client.auto_search || exit 1
        printf 'asu_login_check_for_upgrades='
        uci -q get attendedsysupgrade.client.login_check_for_upgrades || exit 1
        printf 'asu_upgrade_packages='
        uci -q get attendedsysupgrade.client.upgrade_packages || exit 1
        printf 'log_ip='; uci -q get system.@system[0].log_ip || exit 1
        section=ansible_router_system_extra_2222
        printf 'dropbear_2222='; uci -q get dropbear.$section.Port || exit 1
        section=ansible_router_system_extra_2223
        printf 'dropbear_2223='; uci -q get dropbear.$section.Port || exit 1
      register: router_system_uci
      changed_when: false

    - name: Assert configured system values
      ansible.builtin.assert:
        that:
          - "'hostname=molecule-test-router' in router_system_uci.stdout"
          - "'timezone=CET-1CEST,M3.5.0,M10.5.0/3' in router_system_uci.stdout"
          - "'zonename=Europe/Berlin' in router_system_uci.stdout"
          - "'ntp_enabled=0' in router_system_uci.stdout"
          - "'0.example.invalid' in router_system_uci.stdout"
          - "'1.example.invalid' in router_system_uci.stdout"
          - "'log_proto=tcp' in router_system_uci.stdout"
          - "'conloglevel=4' in router_system_uci.stdout"
          - "'cronloglevel=7' in router_system_uci.stdout"
          - "'asu_auto_search=0' in router_system_uci.stdout"
          - "'asu_login_check_for_upgrades=1' in router_system_uci.stdout"
          - "'asu_upgrade_packages=1' in router_system_uci.stdout"
          - "'log_ip=192.0.2.234' in router_system_uci.stdout"
          - "'dropbear_2222=2222' in router_system_uci.stdout"
          - "'dropbear_2223=2223' in router_system_uci.stdout"

    - name: Verify system timezone is applied at runtime
      ansible.builtin.raw: |
        if [ -L /tmp/localtime ]; then
          actual_timezone="$(readlink /tmp/localtime)"
          if [ "$actual_timezone" != \
            /usr/share/zoneinfo/Europe/Berlin ]; then
            echo "Unexpected runtime timezone link: $actual_timezone"
            exit 1
          fi
        else
          actual_timezone="$(cat /tmp/TZ)"
          if [ "$actual_timezone" != \
            'CET-1CEST,M3.5.0,M10.5.0/3' ]; then
            echo "Unexpected runtime TZ value: $actual_timezone"
            exit 1
          fi
        fi
      changed_when: false

    - name: Verify system settings are persisted
      ansible.builtin.raw: |
        test -z "$(uci changes system)" || {
          echo "Uncommitted changes remain in system UCI configuration"
          exit 1
        }
        test -z "$(uci changes attendedsysupgrade)" || {
          echo "Uncommitted changes remain in attendedsysupgrade"
          exit 1
        }
        grep -F "option hostname 'molecule-test-router'" \
          /etc/config/system || exit 1
        grep -F "option timezone 'CET-1CEST,M3.5.0,M10.5.0/3'" \
          /etc/config/system || exit 1
        grep -F "option zonename 'Europe/Berlin'" \
          /etc/config/system || exit 1
        grep -F "option enabled '0'" /etc/config/system || exit 1
        grep -F "list server '0.example.invalid'" /etc/config/system || exit 1
        grep -F "list server '1.example.invalid'" /etc/config/system || exit 1
        grep -F "option log_proto 'tcp'" /etc/config/system || exit 1
        grep -F "option conloglevel '4'" /etc/config/system || exit 1
        grep -F "option cronloglevel '7'" /etc/config/system || exit 1
        grep -F "option auto_search '0'" \
          /etc/config/attendedsysupgrade || exit 1
        grep -F "option login_check_for_upgrades '1'" \
          /etc/config/attendedsysupgrade || exit 1
        grep -F "option upgrade_packages '1'" \
          /etc/config/attendedsysupgrade || exit 1
        grep -F "option log_ip '192.0.2.234'" /etc/config/system || exit 1
      changed_when: false

    - name: Verify Dropbear listeners are persisted
      ansible.builtin.raw: |
        test -z "$(uci changes dropbear)" || {
          echo "Uncommitted changes remain in Dropbear UCI configuration"
          exit 1
        }
        grep -F "config dropbear 'ansible_router_system_extra_2222'" \
          /etc/config/dropbear || exit 1
        grep -F "option Port '2222'" /etc/config/dropbear || exit 1
        grep -F "config dropbear 'ansible_router_system_extra_2223'" \
          /etc/config/dropbear || exit 1
        grep -F "option Port '2223'" /etc/config/dropbear || exit 1
      changed_when: false

    - name: Calculate package list for a changed managed service list
      ansible.builtin.include_role:
        name: router_packages
        tasks_from: calculate_package_list.yml
      vars:
        router_packages_managed_services:
          - snmpd
        router_packages_list:
          - busybox
          - snmpd

    - name: Verify changed service list and package deduplication
      ansible.builtin.assert:
        that:
          - router_packages_install_list == ['busybox', 'snmpd']
