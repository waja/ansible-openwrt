# extensions/molecule/default/converge.yml
---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Include role community.openwrt.init
      ansible.builtin.include_role:
        name: community.openwrt.init

    - name: Apply router hostname role
      ansible.builtin.include_role:
        name: router_hostname
      vars:
        router_hostname_value: molecule-test-router

    - name: Ensure a package is installed (example)
      action: community.openwrt.{{ openwrt_package_manager }}
      args:
        name: luci
        state: present
        update_cache: true
