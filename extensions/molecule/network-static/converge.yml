# extensions/molecule/network-static/converge.yml
---
- name: Test static network configuration without runtime changes
  hosts: all
  gather_facts: false
  vars:
    router_network_apply_runtime_changes: false
  tasks:
    - name: Include role community.openwrt.init
      ansible.builtin.include_role:
        name: community.openwrt.init

    - name: Capture Docker management network state before role tests
      ansible.builtin.raw: |
        printf '%s\n' '--- eth0 ---'
        ip addr show dev eth0
        printf '%s\n' '--- default route ---'
        ip route show default
        printf '%s\n' '--- resolver ---'
        cat /etc/resolv.conf
      register: router_network_state_before
      changed_when: false

    - name: Verify Docker management networking is available
      ansible.builtin.assert:
        that:
          - "'inet ' in router_network_state_before.stdout"
          - "'default via ' in router_network_state_before.stdout"
        fail_msg: >-
          The container must retain its Docker-managed eth0 address and
          default route before configuration-only tests begin.

    - name: Preserve an existing DHCP option
      community.openwrt.uci:
        command: set
        key: dhcp.lan.start
        value: '100'
        autocommit: true

    - name: Apply static network settings and enable LAN DHCP
      ansible.builtin.include_role:
        name: router_network
      vars:
        router_network_interface_mode: static
        router_network_devices:
          - name: br-lan
            type: bridge
            vlan_filtering: true
            ports:
              - lan1
              - lan2
              - lan3
              - wan.69
          - name: wan.69
            type: 8021q
            ifname: wan
            vid: 69
          - name: br-empty
            type: bridge
        router_network_bridge_vlans:
          - device: br-lan
            vlan: 69
            local: true
            ports:
              - name: lan1
                mode: untagged
                pvid: true
              - name: lan2
                mode: untagged
                pvid: true
              - name: lan3
                mode: tagged
        router_network_interfaces:
          lan:
            ipaddr: 192.0.2.1
            netmask: 255.255.255.0
            gateway: 192.0.2.254
            dns:
              - 192.0.2.53
            dhcp:
              enabled: true

    - name: Verify a bridge port cannot be PVID in multiple VLANs
      block:
        - name: Apply an invalid topology with conflicting PVID assignments
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                vlan_filtering: true
                ports:
                  - lan1
            router_network_bridge_vlans:
              - device: br-lan
                vlan: 69
                ports:
                  - name: lan1
                    mode: untagged
                    pvid: true
              - device: br-lan
                vlan: 70
                ports:
                  - name: lan1
                    mode: untagged
                    pvid: true
            router_network_interfaces: {}

        - name: Fail if conflicting PVID assignments are accepted
          ansible.builtin.fail:
            msg: >-
              The topology validator accepted a bridge port assigned as
              PVID in more than one VLAN.
      rescue:
        - name: Verify the expected PVID validation rejected the topology
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate unique PVID assignment per bridge port'
            fail_msg: >-
              The invalid topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify bridge VLANs require VLAN filtering
      block:
        - name: Apply a VLAN to a bridge without VLAN filtering
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                vlan_filtering: false
                ports:
                  - lan1
            router_network_bridge_vlans:
              - device: br-lan
                vlan: 69
                ports:
                  - name: lan1
                    mode: untagged
            router_network_interfaces: {}

        - name: Fail if VLAN filtering is not required
          ansible.builtin.fail:
            msg: >-
              Bridge VLAN validation accepted a bridge without VLAN filtering.
      rescue:
        - name: Verify VLAN filtering validation rejected the topology
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate bridge VLAN references and membership'

    - name: Verify bridge VLAN membership references declared ports
      block:
        - name: Apply a VLAN with an undeclared bridge port
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                vlan_filtering: true
                ports:
                  - lan1
            router_network_bridge_vlans:
              - device: br-lan
                vlan: 69
                ports:
                  - name: lan2
                    mode: tagged
            router_network_interfaces: {}

        - name: Fail if an undeclared bridge port is accepted
          ansible.builtin.fail:
            msg: Bridge VLAN validation accepted an undeclared bridge port.
      rescue:
        - name: Verify bridge port membership validation rejected the topology
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate bridge VLAN references and membership'

    - name: Accept case-distinct device and port PVID names
      ansible.builtin.include_role:
        name: router_network
      vars:
        router_network_devices:
          - name: br-A
            type: bridge
            vlan_filtering: true
            ports:
              - lan-A
              - lan-a
          - name: br-a
            type: bridge
            ports:
              - lan
        router_network_bridge_vlans:
          - device: br-A
            vlan: 69
            ports:
              - name: lan-A
                mode: untagged
                pvid: true
          - device: br-A
            vlan: 70
            ports:
              - name: lan-a
                mode: untagged
                pvid: true
        router_network_interfaces: {}

    - name: Verify a physical port cannot belong to multiple bridges
      block:
        - name: Apply a topology that assigns one port to two bridges
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                ports:
                  - lan1
              - name: br-guest
                type: bridge
                ports:
                  - lan1
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if a port assigned to two bridges is accepted
          ansible.builtin.fail:
            msg: A physical port was accepted as a member of two bridges.
      rescue:
        - name: >-
            Verify the expected cross-bridge validation rejected the topology
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate bridge ports are assigned to only one bridge'
            fail_msg: >-
              The invalid topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify 802.1Q parent and VLAN ID pairs are unique
      block:
        - name: Apply duplicate 802.1Q parent and VLAN ID definitions
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: wan.69
                type: 8021q
                ifname: wan
                vid: 69
              - name: wan-vlan69
                type: 8021q
                ifname: wan
                vid: 69
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if duplicate 802.1Q identities are accepted
          ansible.builtin.fail:
            msg: Duplicate 802.1Q parent and VLAN ID pairs were accepted.
      rescue:
        - name: >-
            Verify the expected 802.1Q identity validation rejected the topology
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate unique 802.1Q parent and VLAN IDs'
            fail_msg: >-
              The invalid topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify an 802.1Q device cannot parent itself
      block:
        - name: Apply an 802.1Q device with itself as parent
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: wan
                type: 8021q
                ifname: wan
                vid: 69
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if a self-parenting 802.1Q device is accepted
          ansible.builtin.fail:
            msg: A self-parenting 802.1Q device was accepted.
      rescue:
        - name: Verify device validation rejected the self-parenting device
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network device definitions'
            fail_msg: >-
              The invalid topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify a boolean is not accepted as an 802.1Q VLAN ID
      block:
        - name: Apply an 802.1Q device with a boolean VLAN ID
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: wan.1
                type: 8021q
                ifname: wan
                vid: true
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if a boolean 802.1Q VLAN ID is accepted
          ansible.builtin.fail:
            msg: A boolean was accepted as an 802.1Q VLAN ID.
      rescue:
        - name: Verify device validation rejected the boolean VLAN ID
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network device definitions'
            fail_msg: >-
              The invalid topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify a boolean is not accepted as a bridge VLAN ID
      block:
        - name: Apply a bridge VLAN with a boolean VLAN ID
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                vlan_filtering: true
                ports:
                  - lan1
            router_network_bridge_vlans:
              - device: br-lan
                vlan: true
                ports:
                  - name: lan1
                    mode: untagged
            router_network_interfaces: {}

        - name: Fail if a boolean bridge VLAN ID is accepted
          ansible.builtin.fail:
            msg: A boolean was accepted as a bridge VLAN ID.
      rescue:
        - name: Verify bridge VLAN validation rejected the boolean VLAN ID
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate bridge VLAN definitions'
            fail_msg: >-
              The invalid topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify topology inputs must be lists
      block:
        - name: Apply a mapping instead of the network device list
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices: {}
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if a mapping is accepted for network devices
          ansible.builtin.fail:
            msg: A mapping was accepted for router_network_devices.
      rescue:
        - name: Verify the network device container check rejected the mapping
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network topology container types'
            fail_msg: >-
              The invalid device container failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify bridge VLAN inputs must be lists
      block:
        - name: Apply a mapping instead of the bridge VLAN list
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices: []
            router_network_bridge_vlans: {}
            router_network_interfaces: {}

        - name: Fail if a mapping is accepted for bridge VLANs
          ansible.builtin.fail:
            msg: A mapping was accepted for router_network_bridge_vlans.
      rescue:
        - name: Verify the bridge VLAN container check rejected the mapping
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network topology container types'
            fail_msg: >-
              The invalid bridge VLAN container failed for an unexpected
              reason: {{ ansible_failed_task.name }}.

    - name: Verify cyclic 802.1Q parent dependencies are rejected
      block:
        - name: Apply a topology with cyclic VLAN parent references
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: wan.69
                type: 8021q
                ifname: wan.70
                vid: 69
              - name: wan.70
                type: 8021q
                ifname: wan.69
                vid: 70
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if cyclic VLAN parent references are accepted
          ansible.builtin.fail:
            msg: Cyclic 802.1Q parent references were accepted.
      rescue:
        - name: Verify the VLAN parent order check rejected the cycle
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate declared 802.1Q parents precede their children'
            fail_msg: >-
              The cyclic topology failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Accept a declared 802.1Q parent before its child
      ansible.builtin.include_role:
        name: router_network
      vars:
        router_network_devices:
          - name: wan.69
            type: 8021q
            ifname: wan
            vid: 69
          - name: wan.69.70
            type: 8021q
            ifname: wan.69
            vid: 70
        router_network_bridge_vlans: []
        router_network_interfaces: {}

    - name: Verify bridge device ports must be lists
      block:
        - name: Apply a bridge with mapping-valued ports
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                ports: {}
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if a mapping is accepted for bridge device ports
          ansible.builtin.fail:
            msg: A mapping was accepted for bridge device ports.
      rescue:
        - name: Verify bridge device validation rejected mapping-valued ports
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network device definitions'
            fail_msg: >-
              The invalid bridge ports failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify bridge VLAN ports must be lists
      block:
        - name: Apply a bridge VLAN with mapping-valued ports
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices:
              - name: br-lan
                type: bridge
                vlan_filtering: true
                ports:
                  - lan1
            router_network_bridge_vlans:
              - device: br-lan
                vlan: 69
                ports: {}
            router_network_interfaces: {}

        - name: Fail if a mapping is accepted for bridge VLAN ports
          ansible.builtin.fail:
            msg: A mapping was accepted for bridge VLAN ports.
      rescue:
        - name: Verify bridge VLAN validation rejected mapping-valued ports
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate bridge VLAN definitions'
            fail_msg: >-
              The invalid bridge VLAN ports failed for an unexpected reason:
              {{ ansible_failed_task.name }}.

    - name: Verify topology device input must be a list, not a tuple
      block:
        - name: Apply tuple-valued network device definitions
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices: >-
              {{ ({'name': 'br-lan', 'type': 'bridge'},) }}
            router_network_bridge_vlans: []
            router_network_interfaces: {}

        - name: Fail if a tuple is accepted for network devices
          ansible.builtin.fail:
            msg: A tuple was accepted for router_network_devices.
      rescue:
        - name: Verify the device container check rejected the tuple
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network topology container types'

    - name: Verify bridge VLAN input must be a list, not a tuple
      block:
        - name: Apply tuple-valued bridge VLAN definitions
          ansible.builtin.include_role:
            name: router_network
          vars:
            router_network_devices: []
            router_network_bridge_vlans: >-
              {{ ({'device': 'br-lan', 'vlan': 69, 'ports': []},) }}
            router_network_interfaces: {}

        - name: Fail if a tuple is accepted for bridge VLANs
          ansible.builtin.fail:
            msg: A tuple was accepted for router_network_bridge_vlans.
      rescue:
        - name: Verify the bridge VLAN container check rejected the tuple
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Validate network topology container types'

    - name: Read static LAN network settings
      community.openwrt.uci:
        command: get
        key: "{{ item.key }}"
      loop:
        - key: network.lan.proto
          expected: static
        - key: network.lan.ipaddr
          expected: 192.0.2.1
        - key: network.lan.netmask
          expected: 255.255.255.0
        - key: network.lan.gateway
          expected: 192.0.2.254
        - key: network.lan.dns
          expected: 192.0.2.53
        - key: network.lan.peerdns
          expected: '0'
        - key: dhcp.lan.ignore
          expected: '0'
        - key: dhcp.lan.start
          expected: '100'
      register: router_network_static_settings
      changed_when: false

    - name: Verify static LAN network settings
      ansible.builtin.assert:
        that:
          - item.result == item.item.expected
        fail_msg: "Unexpected value for {{ item.item.key }}."
      loop: "{{ router_network_static_settings.results }}"

    - name: Capture Docker management network state after role tests
      ansible.builtin.raw: |
        printf '%s\n' '--- eth0 ---'
        ip addr show dev eth0
        printf '%s\n' '--- default route ---'
        ip route show default
        printf '%s\n' '--- resolver ---'
        cat /etc/resolv.conf
      register: router_network_state_after
      changed_when: false

    - name: Verify Docker management network state was preserved
      ansible.builtin.assert:
        that:
          - >-
            router_network_state_after.stdout ==
            router_network_state_before.stdout
        fail_msg: >-
          The network configuration test changed eth0, the default route,
          or the resolver configuration.
