# extensions/molecule/network-static/converge.yml
---
- name: Test static network configuration without runtime changes
  hosts: all
  gather_facts: false
  vars:
    router_network_apply_runtime_changes: false
  tasks:
    - name: Include role community.openwrt.init
      ansible.builtin.include_role:
        name: community.openwrt.init

    - name: Capture Docker management network state before role tests
      ansible.builtin.raw: |
        printf '%s\n' '--- eth0 ---'
        ip addr show dev eth0
        printf '%s\n' '--- default route ---'
        ip route show default
        printf '%s\n' '--- resolver ---'
        cat /etc/resolv.conf
      register: router_network_state_before
      changed_when: false

    - name: Verify Docker management networking is available
      ansible.builtin.assert:
        that:
          - "'inet ' in router_network_state_before.stdout"
          - "'default via ' in router_network_state_before.stdout"
        fail_msg: >-
          The container must retain its Docker-managed eth0 address and
          default route before configuration-only tests begin.

    - name: Preserve an existing DHCP option
      community.openwrt.uci:
        command: set
        key: dhcp.lan.start
        value: '100'
        autocommit: true

    - name: Apply static network settings and enable LAN DHCP
      ansible.builtin.include_role:
        name: router_network
      vars:
        router_network_interface_mode: static
        router_network_interfaces:
          lan:
            ipaddr: 192.0.2.1
            netmask: 255.255.255.0
            gateway: 192.0.2.254
            dns:
              - 192.0.2.53
            dhcp:
              enabled: true

    - name: Read static LAN network settings
      community.openwrt.uci:
        command: get
        key: "{{ item.key }}"
      loop:
        - key: network.lan.proto
          expected: static
        - key: network.lan.ipaddr
          expected: 192.0.2.1
        - key: network.lan.netmask
          expected: 255.255.255.0
        - key: network.lan.gateway
          expected: 192.0.2.254
        - key: network.lan.dns
          expected: 192.0.2.53
        - key: network.lan.peerdns
          expected: '0'
        - key: dhcp.lan.ignore
          expected: '0'
        - key: dhcp.lan.start
          expected: '100'
      register: router_network_static_settings
      changed_when: false

    - name: Verify static LAN network settings
      ansible.builtin.assert:
        that:
          - item.result == item.item.expected
        fail_msg: "Unexpected value for {{ item.item.key }}."
      loop: "{{ router_network_static_settings.results }}"

    - name: Capture Docker management network state after role tests
      ansible.builtin.raw: |
        printf '%s\n' '--- eth0 ---'
        ip addr show dev eth0
        printf '%s\n' '--- default route ---'
        ip route show default
        printf '%s\n' '--- resolver ---'
        cat /etc/resolv.conf
      register: router_network_state_after
      changed_when: false

    - name: Verify Docker management network state was preserved
      ansible.builtin.assert:
        that:
          - >-
            router_network_state_after.stdout ==
            router_network_state_before.stdout
        fail_msg: >-
          The network configuration test changed eth0, the default route,
          or the resolver configuration.
