# roles/router_storage/tasks/expand.yml
---
- name: Download and validate the official OpenWrt root expansion script
  ansible.builtin.raw: |
    set -eu
    if [ ! -s /etc/uci-defaults/70-rootpt-resize ] ||
      [ ! -s /etc/uci-defaults/80-rootfs-resize ]; then
      cd /tmp
      url='https://openwrt.org/_export/code/docs/guide-user/advanced/'
      url="$url"expand_root?codeblock=3
      wget -U "" -O router-storage-expand-root.sh "$url"
      test -s /tmp/router-storage-expand-root.sh
      if grep -qiE '<!doctype[[:space:]]+html|<html|access denied|anubis' \
        /tmp/router-storage-expand-root.sh; then
        echo "ERROR: OpenWrt Wiki returned an HTML access-denied page, not the expansion script." >&2
        exit 1
      fi
      if ! grep -q '70-rootpt-resize' /tmp/router-storage-expand-root.sh ||
        ! grep -q '80-rootfs-resize' /tmp/router-storage-expand-root.sh; then
        echo "ERROR: Downloaded content is not the expected official OpenWrt expansion script." >&2
        exit 1
      fi
    fi
  changed_when: false

- name: Install OpenWrt root expansion prerequisites
  action: "community.openwrt.{{ openwrt_package_manager }}"
  args:
    name: parted,losetup,resize2fs,blkid
    state: present
    update_cache: true

- name: Prepare the official OpenWrt root expansion scripts
  ansible.builtin.raw: |
    set -eu
    changed=0
    if [ ! -s /etc/uci-defaults/70-rootpt-resize ] ||
      [ ! -s /etc/uci-defaults/80-rootfs-resize ]; then
      . /tmp/router-storage-expand-root.sh
      changed=1
    fi
    test -s /etc/uci-defaults/70-rootpt-resize
    test -s /etc/uci-defaults/80-rootfs-resize
    if ! grep -Fxq \
      '/etc/uci-defaults/70-rootpt-resize' /etc/sysupgrade.conf; then
      echo '/etc/uci-defaults/70-rootpt-resize' >> /etc/sysupgrade.conf
      changed=1
    fi
    if ! grep -Fxq \
      '/etc/uci-defaults/80-rootfs-resize' /etc/sysupgrade.conf; then
      echo '/etc/uci-defaults/80-rootfs-resize' >> /etc/sysupgrade.conf
      changed=1
    fi
    echo "changed=$changed"
  register: router_storage_prepare_result
  changed_when: "'changed=1' in router_storage_prepare_result.stdout"

- name: Clear previous resize markers when additional disk space exists
  community.openwrt.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/rootpt-resize
    - /etc/rootfs-resize
  when: router_storage_detection.state == 'required'

- name: Start the appropriate OpenWrt root expansion stage
  ansible.builtin.raw: |
    set -eu
    if [ "{{ router_storage_detection.state }}" = required ]; then
      resize_script=/etc/uci-defaults/70-rootpt-resize
    else
      resize_script=/etc/uci-defaults/80-rootfs-resize
    fi
    test -s "$resize_script"
    ( sleep 2; sh "$resize_script" ) \
      >/tmp/router-storage-resize.log 2>&1 </dev/null &
  changed_when: true

- name: Wait for SSH to stop during the OpenWrt reboot
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ ansible_port | default(22) }}"
    state: stopped
    delay: 0
    sleep: 2
    connect_timeout: 5
    timeout: 180
  delegate_to: localhost

- name: Wait for SSH after the OpenWrt resize reboots
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ ansible_port | default(22) }}"
    state: started
    delay: 15
    sleep: 10
    connect_timeout: 5
    timeout: 900
  delegate_to: localhost

- name: Re-detect root storage after expansion
  ansible.builtin.include_tasks: detect.yml

- name: Require a fully expanded root filesystem
  ansible.builtin.assert:
    that:
      - router_storage_detection.state == 'not_required'
    fail_msg: >-
      OpenWrt root expansion did not reach the expected final state.
      Detected state: {{ router_storage_detection.state }}.
      Review /tmp/router-storage-resize.log on the target.
