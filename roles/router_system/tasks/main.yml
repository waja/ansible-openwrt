# roles/router_system/tasks/main.yml
---
- name: Configure system hostname
  community.openwrt.uci:
    command: set
    key: system.@system[0].hostname
    value: "{{ router_system_hostname }}"

- name: Configure timezone value
  community.openwrt.uci:
    command: set
    key: system.@system[0].timezone
    value: "{{ router_system_timezone }}"

- name: Configure timezone name
  community.openwrt.uci:
    command: set
    key: system.@system[0].zonename
    value: "{{ router_system_timezone_name }}"

- name: Configure NTP client state
  community.openwrt.uci:
    command: set
    key: system.ntp.enabled
    value: "{{ 1 if router_system_ntp_enabled else 0 }}"

- name: Configure NTP server list
  community.openwrt.uci:
    command: set
    key: system.ntp.server
    value: "{{ router_system_ntp_servers }}"

- name: Configure system log protocol
  community.openwrt.uci:
    command: set
    key: system.@system[0].log_proto
    value: "{{ router_system_log_proto }}"

- name: Configure console log level
  community.openwrt.uci:
    command: set
    key: system.@system[0].conloglevel
    value: "{{ router_system_conloglevel }}"

- name: Configure cron log level
  community.openwrt.uci:
    command: set
    key: system.@system[0].cronloglevel
    value: "{{ router_system_cronloglevel }}"

- name: Configure attended sysupgrade automatic search
  community.openwrt.uci:
    command: set
    key: attendedsysupgrade.client.auto_search
    value: "{{ router_system_asu_auto_search }}"

- name: Configure attended sysupgrade login upgrade check
  community.openwrt.uci:
    command: set
    key: attendedsysupgrade.client.login_check_for_upgrades
    value: "{{ router_system_asu_login_check_for_upgrades }}"

- name: Configure attended sysupgrade package upgrades
  community.openwrt.uci:
    command: set
    key: attendedsysupgrade.client.upgrade_packages
    value: "{{ router_system_asu_upgrade_packages }}"

- name: Configure remote syslog server
  community.openwrt.uci:
    command: set
    key: system.@system[0].log_ip
    value: "{{ router_system_log_ip }}"
  when: router_system_log_ip is defined

- name: Validate additional Dropbear ports
  ansible.builtin.assert:
    that:
      - >-
        router_system_dropbear_extra_ports | map('int') | list | length ==
        (
          router_system_dropbear_extra_ports | map('int') | unique |
          list | length
        )
      - >-
        router_system_dropbear_extra_ports | map('int') |
        select('lt', 1) | list | length == 0
      - >-
        router_system_dropbear_extra_ports | map('int') |
        select('gt', 65535) | list | length == 0
      - "22 not in (router_system_dropbear_extra_ports | map('int') | list)"
    fail_msg: >-
      Additional Dropbear ports must be unique TCP ports from 1 to 65535,
      excluding the default SSH port 22.

- name: Read Dropbear configuration
  community.openwrt.uci:
    command: show
    config: dropbear
  register: router_system_dropbear_config
  changed_when: false

- name: Find managed additional Dropbear ports
  ansible.builtin.set_fact:
    router_system_dropbear_managed_ports: >-
      {{
        router_system_dropbear_config.result
        | regex_findall(
            '(?m)^dropbear\.ansible_router_system_extra_([0-9]+)=dropbear$'
          )
        | map('int')
        | list
      }}
  changed_when: false

- name: Initialize Dropbear UCI operations
  ansible.builtin.set_fact:
    router_system_dropbear_operations: []
  changed_when: false

- name: Add obsolete Dropbear listeners to UCI operations
  ansible.builtin.set_fact:
    router_system_dropbear_operations: >-
      {{
        router_system_dropbear_operations +
        [{
          'command': 'absent',
          'key': 'dropbear.ansible_router_system_extra_' ~ item
        }]
      }}
  loop: >-
    {{
      router_system_dropbear_managed_ports
      | difference(router_system_dropbear_extra_ports | map('int') | list)
    }}
  changed_when: false

- name: Add configured Dropbear listeners to UCI operations
  ansible.builtin.set_fact:
    router_system_dropbear_operations: >-
      {{
        router_system_dropbear_operations +
        [{
          'command': 'section',
          'config': 'dropbear',
          'type': 'dropbear',
          'name': 'ansible_router_system_extra_' ~ item,
          'value': {'Port': item | string},
          'replace': true
        }]
      }}
  loop: "{{ router_system_dropbear_extra_ports | map('int') | list }}"
  changed_when: false

- name: Apply Dropbear listener changes in one UCI transaction
  community.openwrt.uci:
    autocommit: true
    operations: "{{ router_system_dropbear_operations }}"
  when: router_system_dropbear_operations | length > 0
  notify: Restart Dropbear
