# roles/router_firewall/defaults/main.yml
---
# Optional router_firewall_default_* variables are intentionally not defaulted.
# Omission preserves the existing UCI value; explicit null removes the option.

# Declarative firewall zones keyed by their desired UCI section IDs.
router_firewall_zones: {}

# Declarative inter-zone firewall forwardings identified by src, dest,
# and family.
router_firewall_forwardings: []

# Declarative firewall rules keyed by their desired UCI section IDs.
router_firewall_rules: {}

# Declarative DNAT/SNAT redirects keyed by their desired UCI section IDs.
router_firewall_redirects: {}

router_firewall_dropbear_extra_ports: []
router_firewall_dropbear_wan_zone: ""

# Set to false for configuration-only runs that must not reload fw4.
router_firewall_apply_runtime_changes: true
