# roles/router_firewall/tasks/manage_redirects.yml
---
- name: Validate firewall redirect configuration
  ansible.builtin.assert:
    that:
      - router_firewall_redirects is mapping
    fail_msg: router_firewall_redirects must be a mapping of UCI section IDs.

- name: Validate firewall redirect definitions
  ansible.builtin.assert:
    that:
      - item.key is string
      - item.key is match('^[A-Za-z0-9_]+$')
      - item.value is mapping
      - item.value.state | default('present') in ['present', 'absent']
      - >-
        item.value.state | default('present') != 'absent' or
        item.value.keys() | difference(['state', 'name']) | length == 0
      - >-
        item.value.target is not defined or item.value.target is none or
        item.value.target in ['DNAT', 'SNAT']
      - item.value.target is not defined or item.value.target is not none
      - >-
        item.value.keys()
        | difference([
            'name', 'state', 'enabled', 'src', 'src_ip', 'src_mac', 'src_port',
            'src_dip',
            'src_dport', 'dest', 'dest_ip', 'dest_port', 'proto',
            'family', 'target', 'reflection', 'reflection_src',
            'reflection_zone', 'limit', 'limit_burst', 'start_date',
            'start_time', 'stop_date', 'stop_time', 'weekdays',
            'utc_time', 'helper', 'mark'
          ])
        | length == 0
      - >-
        (item.value.name | default(item.key)) is string and
        (item.value.name | default(item.key)) | length > 0
      - >-
        item.value.enabled is not defined or item.value.enabled is none or
        item.value.enabled is boolean
      - >-
        item.value.reflection is not defined or
        item.value.reflection is none or item.value.reflection is boolean
      - >-
        item.value.reflection_src is not defined or
        item.value.reflection_src is none or
        item.value.reflection_src in ['internal', 'external']
      - >-
        item.value.state | default('present') == 'absent' or
        (
          (
            item.value.reflection is not defined or
            item.value.reflection is none
          ) and
          (
            item.value.reflection_src is not defined or
            item.value.reflection_src is none
          ) and
          (
            item.value.reflection_zone is not defined or
            item.value.reflection_zone is none
          )
        ) or item.value.get('target') is none or
        item.value.get('target') == 'DNAT'
      - >-
        item.value.utc_time is not defined or item.value.utc_time is none or
        item.value.utc_time is boolean
      - >-
        item.value.limit_burst is not defined or
        item.value.limit_burst is none or
        (item.value.limit_burst is integer and
         item.value.limit_burst is not boolean and item.value.limit_burst > 0)
      - >-
        item.value.family is not defined or item.value.family is none or
        item.value.family in ['ipv4', 'ipv6', 'any']
      - >-
        item.value.src_mac is not defined or item.value.src_mac is none or
        (item.value.src_mac is string and item.value.src_mac | length > 0) or
        (item.value.src_mac is sequence and item.value.src_mac is not string
         and item.value.src_mac is not mapping and
         item.value.src_mac | length > 0 and
         item.value.src_mac | select('string') | reject('equalto', '')
           | list | length == item.value.src_mac | length)
      - >-
        item.value.proto is not defined or item.value.proto is none or
        (item.value.proto is string and item.value.proto | length > 0) or
        (item.value.proto is sequence and item.value.proto is not string
         and item.value.proto is not mapping and item.value.proto | length > 0
         and item.value.proto | select('string') | reject('equalto', '')
             | list | length == item.value.proto | length)
      - >-
        item.value.reflection_zone is not defined or
        item.value.reflection_zone is none or
        (item.value.reflection_zone is sequence and
         item.value.reflection_zone is not string and
         item.value.reflection_zone is not mapping and
         item.value.reflection_zone | length > 0 and
         item.value.reflection_zone | select('string')
           | reject('equalto', '') | list | length
           == item.value.reflection_zone | length)
      - >-
        item.value.weekdays is not defined or item.value.weekdays is none or
        (
          item.value.weekdays is string
          and item.value.weekdays | trim | length > 0
        )
      - >-
        item.value.src_dport is not defined or item.value.src_dport is none or
        (
          item.value.src_dport is string and
          (
            item.value.src_dport | trim
            | regex_search('^!?\s*[0-9]{1,5}([:-][0-9]{1,5})?$')
          ) is not none and
          (
            item.value.src_dport | regex_findall('[0-9]{1,5}')
            | map('int') | list | max
          ) <= 65535 and
          (
            (
              item.value.src_dport | regex_findall('[0-9]{1,5}')
              | length
            ) == 1 or
            (
              (
                item.value.src_dport | regex_findall('[0-9]{1,5}')
                | first | int
              ) <= (
                item.value.src_dport | regex_findall('[0-9]{1,5}')
                | last | int
              )
            )
          )
        )
      - >-
        item.value.dest_port is not defined or item.value.dest_port is none or
        (
          item.value.dest_port is string and
          (
            item.value.dest_port | trim
            | regex_search('^!?\s*[0-9]{1,5}([:-][0-9]{1,5})?$')
          ) is not none and
          (
            item.value.dest_port | regex_findall('[0-9]{1,5}')
            | map('int') | list | max
          ) <= 65535 and
          (
            (
              item.value.dest_port | regex_findall('[0-9]{1,5}')
              | length
            ) == 1 or
            (
              (
                item.value.dest_port | regex_findall('[0-9]{1,5}')
                | first | int
              ) <= (
                item.value.dest_port | regex_findall('[0-9]{1,5}')
                | last | int
              )
            )
          )
        )
      - >-
        item.value.keys()
        | difference([
            'name', 'state', 'enabled', 'reflection', 'utc_time',
            'limit_burst', 'family', 'target', 'proto', 'src_mac',
            'reflection_zone'
          ])
        | map('extract', item.value)
        | reject('equalto', none)
        | select('string')
        | list | length
        ==
        item.value.keys()
        | difference([
            'name', 'state', 'enabled', 'reflection', 'utc_time',
            'limit_burst', 'family', 'target', 'proto', 'src_mac',
            'reflection_zone'
          ])
        | map('extract', item.value)
        | reject('equalto', none)
        | list | length
    fail_msg: >-
      Invalid firewall redirect '{{ item.key }}'. Use supported redirect
      options, DNAT/SNAT targets, scalar strings, and non-empty lists for
      proto/src_mac/reflection_zone. Weekdays must be a whitespace-separated
      string; enabled, reflection, and utc_time must be booleans; limit_burst
      must be a positive integer. State absent accepts only name and state.
  loop: "{{ router_firewall_redirects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Initialize desired firewall redirect names
  ansible.builtin.set_fact:
    router_firewall_desired_redirect_names: []
  changed_when: false

- name: Collect desired firewall redirect names
  ansible.builtin.set_fact:
    router_firewall_desired_redirect_names: >-
      {{ router_firewall_desired_redirect_names
         + [item.value.name | default(item.key)] }}
  loop: "{{ router_firewall_redirects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.state | default('present') == 'present'
  changed_when: false

- name: Validate desired firewall redirect names are unique
  ansible.builtin.assert:
    that:
      - >-
        router_firewall_desired_redirect_names | unique | list | length
        == router_firewall_desired_redirect_names | length
    fail_msg: Firewall redirect names must be unique.

- name: Initialize firewall redirect zone references
  ansible.builtin.set_fact:
    router_firewall_redirect_zone_references: []
  changed_when: false

- name: Collect firewall redirect zone references
  ansible.builtin.set_fact:
    router_firewall_redirect_zone_references: >-
      {{
        router_firewall_redirect_zone_references | default([])
        + [{
            'redirect_id': item.0.key,
            'option': item.1,
            'zone_name': item.0.value[item.1]
          }]
      }}
  loop: >-
    {{
      router_firewall_redirects | dict2items
      | product(['src', 'dest']) | list
    }}
  loop_control:
    label: "{{ item.0.key }}.{{ item.1 }}"
  when:
    - item.0.value.state | default('present') == 'present'
    - item.0.value[item.1] is defined
    - item.0.value[item.1] is not none
  changed_when: false

- name: Check named firewall zones referenced by redirects
  community.openwrt.uci:
    command: get
    key: "firewall.{{ item.zone_name }}"
  loop: "{{ router_firewall_redirect_zone_references | default([]) }}"
  loop_control:
    label: "{{ item.zone_name }}"
  register: router_firewall_redirect_named_zone_references
  changed_when: false
  failed_when: false

- name: Find firewall zones referenced by redirects
  community.openwrt.uci:
    command: find_all
    config: firewall
    type: zone
    option: name
    find: "{{ item.zone_name }}"
  loop: "{{ router_firewall_redirect_zone_references | default([]) }}"
  loop_control:
    label: "{{ item.zone_name }}"
  register: router_firewall_redirect_anonymous_zone_references
  changed_when: false

- name: Validate firewall redirect zone references
  ansible.builtin.assert:
    that:
      - >-
        item.0.zone_name in router_firewall_desired_zone_names or
        (
          item.2.result_list | default([]) | length > 0 and
          item.0.zone_name not in router_firewall_zone_names_to_remove
        )
    fail_msg: >-
      Firewall redirect '{{ item.0.redirect_id }}' references an unknown
      zone '{{ item.0.zone_name }}'.
  loop: >-
    {{
      (router_firewall_redirect_zone_references | default([]))
      | zip(
          router_firewall_redirect_named_zone_references.results | default([])
        )
      | zip(
          router_firewall_redirect_anonymous_zone_references.results
          | default([])
        )
      | map('flatten') | list
    }}
  loop_control:
    label: "{{ item.0.redirect_id }}.{{ item.0.option }}"

- name: Collect reflection zones referenced by redirects
  ansible.builtin.set_fact:
    router_firewall_redirect_reflection_zone_names: >-
      {{
        router_firewall_redirects | dict2items
        | selectattr('value.reflection_zone', 'defined')
        | map(attribute='value.reflection_zone')
        | flatten | unique | list
      }}
  changed_when: false

- name: Check named firewall reflection zones
  community.openwrt.uci:
    command: get
    key: "firewall.{{ item }}"
  loop: "{{ router_firewall_redirect_reflection_zone_names }}"
  register: router_firewall_redirect_named_reflection_zones
  changed_when: false
  failed_when: false

- name: Find anonymous firewall reflection zones
  community.openwrt.uci:
    command: find_all
    config: firewall
    type: zone
    option: name
    find: "{{ item }}"
  loop: "{{ router_firewall_redirect_reflection_zone_names }}"
  register: router_firewall_redirect_anonymous_reflection_zones
  changed_when: false

- name: Validate firewall redirect reflection zone references
  ansible.builtin.assert:
    that:
      - >-
        item.0 in router_firewall_desired_zone_names or
        (
          item.2.result_list | default([]) | length > 0 and
          item.0 not in router_firewall_zone_names_to_remove
        )
    fail_msg: >-
      Firewall redirect reflection references unknown zone '{{ item.0 }}'.
  loop: >-
    {{
      router_firewall_redirect_reflection_zone_names
      | zip(
          router_firewall_redirect_named_reflection_zones.results | default([])
        )
      | zip(
          router_firewall_redirect_anonymous_reflection_zones.results
          | default([])
        )
      | map('flatten') | list
    }}
  loop_control:
    label: "{{ item.0 }}"

- name: Check for firewall redirects with the desired section ID
  community.openwrt.uci:
    command: get
    key: "firewall.{{ item.key }}"
  loop: "{{ router_firewall_redirects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: router_firewall_named_redirects
  changed_when: false
  failed_when: false

- name: Validate existing named firewall redirect sections
  ansible.builtin.assert:
    that:
      - item.result | default('') in ['', 'redirect']
    fail_msg: >-
      UCI section '{{ item.item.key }}' exists but is not a firewall redirect.
      Choose another section ID or resolve the conflicting section.
  loop: "{{ router_firewall_named_redirects.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Reject redirects already assigned to a different named section
  ansible.builtin.assert:
    that:
      - >-
        router_firewall_uci_show.result
        | regex_findall(
            "(?ms)^firewall\\.([A-Za-z0-9_]+)=redirect\\n.*?"
            ~ "^firewall\\.\\1\\.name='"
            ~ (item.0.value.name | default(item.0.key) | regex_escape)
            ~ "'$"
          )
        | reject('equalto', item.0.key)
        | list
        | length == 0
    fail_msg: >-
      Firewall redirect '{{ item.0.value.name | default(item.0.key) }}'
      already exists under a different named UCI section ID. Use its
      existing section ID rather than creating a duplicate.
  loop: >-
    {{
      router_firewall_redirects
      | dict2items
      | zip(router_firewall_named_redirects.results)
      | list
    }}
  loop_control:
    label: "{{ item.0.key }}"

- name: Find firewall redirects with matching names
  community.openwrt.uci:
    command: find_all
    config: firewall
    type: redirect
    option: name
    find: "{{ item.value.name | default(item.key) }}"
  loop: "{{ router_firewall_redirects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: router_firewall_matching_redirects
  changed_when: false

- name: Reject ambiguous anonymous firewall redirect matches
  ansible.builtin.assert:
    that:
      - >-
        item.1.result != '' or
        item.0.value.name is not defined or
        (item.2.result_list | default([]) | length <= 1)
    fail_msg: >-
      More than one firewall redirect matches the name
      '{{ item.0.value.name | default(item.0.key) }}'. Refusing to adopt
      an ambiguous anonymous redirect.
  loop: >-
    {{
      router_firewall_redirects | dict2items
      | zip(router_firewall_named_redirects.results)
      | zip(router_firewall_matching_redirects.results)
      | map('flatten') | list
    }}
  loop_control:
    label: "{{ item.0.key }}"

- name: Require an explicit target for target-specific partial redirect updates
  ansible.builtin.assert:
    that:
      - >-
        item.0.value.state | default('present') == 'absent' or
        item.0.value.get('target') is not none or
        (
          (item.0.value.src_mac is not defined or
           item.0.value.src_mac is none) and
          (item.0.value.helper is not defined or
           item.0.value.helper is none) and
          (item.0.value.reflection is not defined or
           item.0.value.reflection is none) and
          (item.0.value.reflection_src is not defined or
           item.0.value.reflection_src is none) and
          (item.0.value.reflection_zone is not defined or
           item.0.value.reflection_zone is none) and
          (item.0.value.src is not defined or
           item.0.value.src is not none) and
          (item.0.value.dest is not defined or
           item.0.value.dest is not none) and
          (item.0.value.src_dip is not defined or
           item.0.value.src_dip is not none)
        ) or
        (
          item.1.result != 'redirect' and
          (item.2.result_list | default([]) | length == 0)
        )
    fail_msg: >-
      Specify target when adding src_mac, helper, or reflection options, or
      removing src, dest, or src_dip from an existing redirect so the role
      can validate DNAT/SNAT compatibility.
  loop: >-
    {{
      router_firewall_redirects | dict2items
      | zip(router_firewall_named_redirects.results)
      | zip(router_firewall_matching_redirects.results)
      | map('flatten') | list
    }}
  loop_control:
    label: "{{ item.0.key }}"

- name: Validate target-specific options for firewall redirects
  ansible.builtin.assert:
    that:
      - >-
        item.0.value.state | default('present') == 'absent' or
        item.0.value.enabled is false or
        (
          item.0.value.target is not defined and
          (
            item.1.result == 'redirect' or
            (
              item.0.value.name is defined and
              item.2.result_list | default([]) | length == 1
            )
          )
        ) or
        (
          (
            item.0.value.target | default('DNAT') == 'DNAT' and
            item.0.value.src is defined and
            item.0.value.src is not none and
            item.0.value.src != '*'
          ) or
          (
            item.0.value.target | default('DNAT') == 'SNAT' and
            item.0.value.dest is defined and
            item.0.value.dest is not none and
            item.0.value.dest != '*' and
            item.0.value.src_dip is defined and
            item.0.value.src_dip is not none
          )
        )
      - >-
        item.0.value.state | default('present') == 'absent' or
        item.0.value.target | default('DNAT') != 'SNAT' or
        (
          (item.0.value.src_mac is not defined or
           item.0.value.src_mac is none) and
          (item.0.value.helper is not defined or
           item.0.value.helper is none)
        )
      - >-
        item.0.value.state | default('present') == 'absent' or
        item.0.value.target | default('DNAT') != 'SNAT' or
        (
          item.0.value.reflection is not defined or
          item.0.value.reflection is none
        ) and
        (
          item.0.value.reflection_src is not defined or
          item.0.value.reflection_src is none
        ) and
        (
          item.0.value.reflection_zone is not defined or
          item.0.value.reflection_zone is none
        )
    fail_msg: >-
      New redirects default to DNAT and require a non-wildcard src zone.
      SNAT requires a non-wildcard dest zone and src_dip, and does not
      support src_mac, helper, or reflection options. Existing redirects
      can be updated partially when target is omitted.
  loop: >-
    {{
      router_firewall_redirects | dict2items
      | zip(router_firewall_named_redirects.results)
      | zip(router_firewall_matching_redirects.results)
      | map('flatten') | list
    }}
  loop_control:
    label: "{{ item.0.key }}"

- name: Add operations for declarative firewall redirects
  ansible.builtin.set_fact:
    router_firewall_operations: >-
      {{
        router_firewall_operations + (
          [{
            'command': 'absent',
            'key': 'firewall.' ~ item.0.key
          }]
          if item.0.value.state | default('present') == 'absent' and
             item.1.result == 'redirect'
          else (
            [{
              'command': 'absent',
              'config': 'firewall',
              'type': 'redirect',
              'find': {'name': item.0.value.name | default(item.0.key)}
            }]
            if item.0.value.state | default('present') == 'absent' and
               item.1.result == '' and item.0.value.name is defined and
               (item.2.result_list | default([]) | length == 1)
            else (
              [{
                'command': 'section',
                'config': 'firewall',
                'type': 'redirect',
                'name': item.0.key,
                'value': (
                  item.0.value
                  | dict2items
                  | rejectattr('key', 'equalto', 'state')
                  | rejectattr('value', 'none')
                  | items2dict
                  | combine(
                      {'name': item.0.value.name}
                      if item.0.value.name is defined
                      else (
                        {}
                        if item.1.result == 'redirect'
                        else {'name': item.0.key}
                      )
                    )
                )
              } | combine(
                {
                  'find': {'name': item.0.value.name | default(item.0.key)}
                }
                if item.1.result == '' and item.0.value.name is defined
                   and (item.2.result_list | default([]) | length == 1)
                else {}
              )]
              if item.0.value.state | default('present') == 'present'
              else []
            )
          )
        )
      }}
  loop: >-
    {{
      router_firewall_redirects | dict2items
      | zip(router_firewall_named_redirects.results)
      | zip(router_firewall_matching_redirects.results)
      | map('flatten') | list
    }}
  loop_control:
    label: "{{ item.0.key }}"
  changed_when: false

- name: Add operations to remove explicitly null firewall redirect options
  ansible.builtin.include_tasks: add_redirect_null_option_operations.yml
  loop: "{{ router_firewall_redirects | dict2items }}"
  loop_control:
    loop_var: router_firewall_redirect
    index_var: router_firewall_redirect_index
    label: "{{ router_firewall_redirect.key }}"
