# roles/router_firewall/tasks/manage_one_forwarding.yml
---
- name: Find firewall forwardings with the requested source zone
  community.openwrt.uci:
    command: find_all
    config: firewall
    type: forwarding
    option: src
    find: "{{ router_firewall_forwarding.src }}"
  register: router_firewall_forwarding_candidates
  changed_when: false

- name: Initialize exact firewall forwarding matches
  ansible.builtin.set_fact:
    router_firewall_forwarding_matches: []
  changed_when: false

- name: Inspect candidate forwarding identity
  ansible.builtin.include_tasks: inspect_forwarding_candidate.yml
  loop: "{{ router_firewall_forwarding_candidates.result_list | default([]) }}"
  loop_control:
    loop_var: router_firewall_forwarding_candidate
    label: "{{ router_firewall_forwarding_candidate }}"

- name: Reject ambiguous firewall forwarding identities
  ansible.builtin.assert:
    that:
      - router_firewall_forwarding_matches | length <= 1
    fail_msg: >-
      More than one firewall forwarding matches
      src='{{ router_firewall_forwarding.src }}',
      dest='{{ router_firewall_forwarding.dest }}',
      family='{{ router_firewall_forwarding.family | default('any', true) }}'.
      Resolve the duplicate UCI sections before retrying.

- name: Derive a stable UCI section ID for the forwarding identity
  ansible.builtin.set_fact:
    router_firewall_forwarding_generated_section_id: >-
      router_fw_fwd_{{
        (
          router_firewall_forwarding.src ~ '|' ~
          router_firewall_forwarding.dest ~ '|' ~
          (router_firewall_forwarding.family | default('any', true))
        ) | hash('sha1') | truncate(12, true, '')
      }}
  changed_when: false

- name: Check the stable forwarding section ID
  community.openwrt.uci:
    command: get
    key: "firewall.{{ router_firewall_forwarding_generated_section_id }}"
  register: router_firewall_forwarding_generated_section
  changed_when: false
  failed_when: false

- name: Read the stable forwarding source
  community.openwrt.uci:
    command: get
    key: "firewall.{{ router_firewall_forwarding_generated_section_id }}.src"
  register: router_firewall_forwarding_stable_src
  changed_when: false
  failed_when: false
  when: >-
    router_firewall_forwarding_generated_section.result | default('')
    == 'forwarding'

- name: Read the stable forwarding destination
  community.openwrt.uci:
    command: get
    key: "firewall.{{ router_firewall_forwarding_generated_section_id }}.dest"
  register: router_firewall_forwarding_stable_dest
  changed_when: false
  failed_when: false
  when: >-
    router_firewall_forwarding_generated_section.result | default('')
    == 'forwarding'

- name: Read the stable forwarding family
  community.openwrt.uci:
    command: get
    key: "firewall.{{ router_firewall_forwarding_generated_section_id }}.family"
  register: router_firewall_forwarding_stable_family
  changed_when: false
  failed_when: false
  when: >-
    router_firewall_forwarding_generated_section.result | default('')
    == 'forwarding'

- name: Reject a conflicting stable forwarding section ID
  ansible.builtin.assert:
    that:
      - >-
        router_firewall_forwarding_generated_section.result | default('')
        in ['', 'forwarding']
      - >-
        router_firewall_forwarding_generated_section.result | default('')
        != 'forwarding' or router_firewall_forwarding_matches | length == 1
      - >-
        router_firewall_forwarding_generated_section.result | default('')
        != 'forwarding' or
        router_firewall_forwarding_stable_src.result | default('')
        == router_firewall_forwarding.src
      - >-
        router_firewall_forwarding_generated_section.result | default('')
        != 'forwarding' or
        router_firewall_forwarding_stable_dest.result | default('')
        == router_firewall_forwarding.dest
      - >-
        router_firewall_forwarding_generated_section.result | default('')
        != 'forwarding' or
        (
          router_firewall_forwarding_stable_family.result | default('') | trim
          if router_firewall_forwarding_stable_family.result | default('')
             | trim
             not in ['', 'null']
          else 'any'
        ) == (router_firewall_forwarding.family | default('any', true))
    fail_msg: >-
      UCI section '{{ router_firewall_forwarding_generated_section_id }}'
      conflicts with the requested forwarding identity. Resolve the
      conflicting section first.

- name: Collect a matched section rename for the shared transaction
  ansible.builtin.set_fact:
    router_firewall_forwarding_rename_items: >-
      {{
        router_firewall_forwarding_rename_items + [{
          'section_id': router_firewall_forwarding_matches[0],
          'name': router_firewall_forwarding_generated_section_id,
          'index': (
            router_firewall_forwarding_matches[0]
            | regex_findall('\[([0-9]+)\]') | first | int
          ) if router_firewall_forwarding_matches[0]
               is match('^@forwarding\[') else -1
        }]
      }}
  when:
    - router_firewall_forwarding_matches | length == 1
    - router_firewall_forwarding_generated_section.result | default('') == ''
  changed_when: false

- name: Collect the resolved forwarding for the shared UCI transaction
  ansible.builtin.set_fact:
    router_firewall_forwarding_managed_items: >-
      {{
        router_firewall_forwarding_managed_items + [{
          'src': router_firewall_forwarding.src,
          'dest': router_firewall_forwarding.dest,
          'family': router_firewall_forwarding.family | default('any', true),
          'family_null': router_firewall_forwarding.family is defined
                         and router_firewall_forwarding.family is none,
          'family_supplied': router_firewall_forwarding.family is defined,
          'name': router_firewall_forwarding.name | default(none),
          'name_supplied': router_firewall_forwarding.name is defined,
          'enabled': router_firewall_forwarding.enabled | default(none),
          'enabled_supplied': router_firewall_forwarding.enabled is defined,
          'state': router_firewall_forwarding.state | default('present'),
          'section_id': router_firewall_forwarding_generated_section_id,
          'matched': router_firewall_forwarding_matches | length == 1
        }]
      }}
  changed_when: false
