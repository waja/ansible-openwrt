# roles/router_base/tasks/main.yml
---
- name: Generate service restart lock token
  ansible.builtin.set_fact:
    router_base_service_lock_token: >-
      {{ lookup('password', '/dev/null length=32') }}
  changed_when: false

- name: Acquire the shared service restart lock
  ansible.builtin.raw: |
    lock_root=/root/.ansible-locks
    lock="$lock_root/router-packages-restart-lock"
    token='{{ router_base_service_lock_token }}'
    timeout={{ router_base_service_restart_lock_timeout | int }}
    waited=0
    umask 077
    mkdir -p "$lock_root" && chmod 700 "$lock_root" || exit 1
    legacy_lock=/tmp/router-packages-restart-lock
    legacy_owner="$legacy_lock.owner.$token"
    while ! mkdir "$legacy_lock" 2>/dev/null; do
      if [ "$waited" -ge "$timeout" ]; then
        echo "Timed out waiting for legacy service restart lock" >&2
        exit 1
      fi
      sleep 1
      waited=$((waited + 1))
    done
    : > "$legacy_owner"
    until mkdir "$lock" 2>/dev/null; do
      if [ "$waited" -ge "$timeout" ]; then
        rm -f "$legacy_owner"; rmdir "$legacy_lock" 2>/dev/null || true;
        echo "Timed out waiting for lock: $lock" >&2
        exit 1
      fi
      sleep 1
      waited=$((waited + 1))
    done
    printf '%s\n' "$token" > "$lock/owner" || {
      rmdir "$lock" 2>/dev/null || true
      rm -f "$legacy_owner"; rmdir "$legacy_lock" 2>/dev/null || true;
      exit 1
    }
  register: router_base_service_lock_acquisition
  changed_when: false

- name: Apply base service configuration while holding the lock
  block:
    - name: Remove obsolete configuration files before service startup
      community.openwrt.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ router_base_obsolete_files }}"

    - name: Check whether service restarts are pending
      community.openwrt.stat:
        path: /tmp/router-packages-restart-pending
      register: router_base_pending_restart_stat

    - name: Create service restart completion marker directory
      community.openwrt.file:
        path: /tmp/router-packages-restart-completed
        state: directory
      when: router_base_pending_restart_stat.stat.exists

    - name: Enable and start or restart required services
      ansible.builtin.include_tasks: restart_service.yml
      loop: "{{ router_base_services }}"

    - name: Clear pending service restart marker
      community.openwrt.file:
        path: /tmp/router-packages-restart-pending
        state: absent
      when: router_base_pending_restart_stat.stat.exists

    - name: Remove service restart completion markers
      community.openwrt.file:
        path: /tmp/router-packages-restart-completed
        state: absent

  always:
    - name: Release the shared service restart lock
      ansible.builtin.raw: |
        lock=/root/.ansible-locks/router-packages-restart-lock
        token='{{ router_base_service_lock_token }}'
        if [ -f "$lock/owner" ] &&
           [ "$(cat "$lock/owner")" = "$token" ]; then
          rm -f "$lock/owner"
          rmdir "$lock"
        fi
        legacy_lock=/tmp/router-packages-restart-lock
        legacy_owner="$legacy_lock.owner.$token"
        if [ -f "$legacy_owner" ]; then
          rm -f "$legacy_owner"
          rmdir "$legacy_lock" 2>/dev/null || true
        fi
      when: router_base_service_lock_acquisition is succeeded
      changed_when: false
