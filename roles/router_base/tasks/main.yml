# roles/router_base/tasks/main.yml
---
- name: Acquire the shared service restart lock
  ansible.builtin.raw: |
    lock=/etc/.router-packages-restart-lock
    timeout={{ router_base_service_restart_lock_timeout | int }}
    waited=0
    until mkdir "$lock" 2>/dev/null; do
      if [ "$waited" -ge "$timeout" ]; then
        echo "Timed out waiting for service restart lock: $lock" >&2
        exit 1
      fi
      sleep 1
      waited=$((waited + 1))
    done
  changed_when: false

- name: Apply base service configuration while holding the lock
  block:
    - name: Remove obsolete configuration files before service startup
      community.openwrt.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ router_base_obsolete_files }}"

    - name: Check whether service restarts are pending
      community.openwrt.stat:
        path: /etc/.router-packages-restart-pending
      register: router_base_pending_restart_stat

    - name: Enable and start or restart required services
      community.openwrt.service:
        name: "{{ item }}"
        enabled: true
        state: >-
          {{ 'restarted' if router_base_pending_restart_stat.stat.exists
             else 'started' }}
      loop: "{{ router_base_services }}"

    - name: Clear pending service restart marker
      community.openwrt.file:
        path: /etc/.router-packages-restart-pending
        state: absent
      when: router_base_pending_restart_stat.stat.exists
  always:
    - name: Release the shared service restart lock
      ansible.builtin.raw: >-
        rmdir /etc/.router-packages-restart-lock
      changed_when: false
