---
- name: Check whether the LibreNMS script needs an update
  community.openwrt.command:
    cmd: >-
      cmp -s
      {{ router_librenms_source_file }}
      /etc/librenms/{{ router_librenms_script.name }}
  register: router_librenms_script_comparison
  failed_when: false
  changed_when: false

- name: Copy updated LibreNMS script on the router
  community.openwrt.command:
    cmd: >-
      cp
      {{ router_librenms_source_file }}
      /etc/librenms/{{ router_librenms_script.name }}
  when: router_librenms_script_comparison.rc != 0
  changed_when: true
  notify: Restart SNMP daemon

- name: Set LibreNMS script permissions
  community.openwrt.command:
    cmd: "chmod 0755 /etc/librenms/{{ router_librenms_script.name }}"
  when: router_librenms_script_comparison.rc != 0
  changed_when: false
