---
- name: Check whether the LibreNMS script needs an update
  community.openwrt.command:
    cmd: >-
      cmp -s
      {{ router_librenms_source_file | quote }}
      {{ ('/etc/librenms/' ~ router_librenms_script.name) | quote }}
    uses_shell: true
  register: router_librenms_script_comparison
  failed_when: false
  changed_when: false
  ignore_unreachable: true

- name: Copy updated LibreNMS script on the router
  community.openwrt.command:
    cmd: >-
      cp
      {{ router_librenms_source_file | quote }}
      {{ ('/etc/librenms/' ~ router_librenms_script.name) | quote }}
    uses_shell: true
  when:
    - router_librenms_script_comparison.rc is defined
    - router_librenms_script_comparison.rc != 0
  changed_when: true
  ignore_unreachable: true
  notify: Restart SNMP daemon

- name: Ensure LibreNMS script permissions
  community.openwrt.command:
    cmd: >-
      mode=$(busybox stat -c %a
      {{ ('/etc/librenms/' ~ router_librenms_script.name) | quote }})
      || exit $?;
      if [ "$mode" != 755 ]; then
        chmod 0755
        {{ ('/etc/librenms/' ~ router_librenms_script.name) | quote }}
        && echo permissions-updated;
      fi
    uses_shell: true
  register: router_librenms_script_permissions
  changed_when: "'permissions-updated' in router_librenms_script_permissions.stdout"
  ignore_unreachable: true
  notify: Restart SNMP daemon
