# roles/router_cve_2026_98432/tasks/main.yml
---
- name: Read the running kernel release
  community.openwrt.command:
    cmd: uname -r
  register: router_cve_2026_98432_running_kernel
  changed_when: false
  check_mode: false

- name: Classify the running 6.6 kernel against the upstream fixed threshold
  ansible.builtin.set_fact:
    router_cve_2026_98432_kernel_status: >-
      {% set release = router_cve_2026_98432_running_kernel.stdout | trim %}
      {% if release is match('^6\.6\.[0-9]+-rc[0-9]+') %}
      unknown
      {% elif release is match('^6\.6\.[0-9]+([.+-]|$)') %}
      {% set patchlevel = (
        release.split('.')[2].split('-')[0].split('+')[0] | int
      ) %}
      {{
        'fixed_threshold_met'
        if patchlevel >= 159
        else 'below_fixed_threshold'
      }}
      {% else %}
      unknown
      {% endif %}
  changed_when: false

- name: Report running kernel classification
  ansible.builtin.debug:
    msg: >-
      Running kernel {{ router_cve_2026_98432_running_kernel.stdout | trim }}:
      {{ router_cve_2026_98432_kernel_status }}. This is version information
      only; verify vendor backports and advisories before changing mitigation
      state.

- name: Validate requested mitigation state
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_state in ['present', 'absent']
      - router_cve_2026_98432_apply_runtime_changes is boolean
    fail_msg: >-
      State must be present or absent and runtime changes must be boolean.


- name: Check firewall4 availability
  community.openwrt.command:
    cmd: /sbin/fw4 --help
  changed_when: false
  check_mode: false

- name: Refuse unrelated pending firewall UCI changes
  community.openwrt.command:
    cmd: uci changes firewall
  register: router_cve_2026_98432_pending_firewall_changes
  changed_when: false
  check_mode: false

- name: Ensure the firewall UCI package has no pending operator changes
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_pending_firewall_changes.stdout | trim == ''
    fail_msg: >-
      The firewall UCI package has uncommitted changes. Commit or discard them
      before managing the CVE mitigation.

- name: Check firewall service is enabled
  community.openwrt.command:
    cmd: /etc/init.d/firewall enabled
  changed_when: false
  check_mode: false

- name: Read the owned UCI include
  community.openwrt.uci:
    command: get
    key: firewall.ansible_cve_2026_98432
  register: router_cve_2026_98432_include
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the owned UCI include options
  community.openwrt.uci:
    command: get
    key: "firewall.ansible_cve_2026_98432.{{ item }}"
  loop:
    - type
    - path
    - position
    - enabled
  register: router_cve_2026_98432_include_options
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the owned ruleset path is a symlink
  community.openwrt.command:
    cmd: test -L /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_file_is_symlink
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the owned ruleset path exists
  community.openwrt.command:
    cmd: test -e /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_file_exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the owned ruleset path is a regular file
  community.openwrt.command:
    cmd: test -f /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_file_is_regular
  changed_when: false
  failed_when: false
  check_mode: false

- name: Reject non-regular objects at the owned ruleset path
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_file_is_symlink.rc != 0
      - >-
        router_cve_2026_98432_file_exists.rc != 0
        or router_cve_2026_98432_file_is_regular.rc == 0
    fail_msg: >-
      /etc/cve_2026_98432.nft exists but is not a regular file, or is a
      symlink. Refusing to follow or remove an unmanaged filesystem object.


- name: Check whether sysupgrade configuration exists
  community.openwrt.command:
    cmd: test -f /etc/sysupgrade.conf
  register: router_cve_2026_98432_sysupgrade_file_exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether sysupgrade already preserves the ruleset
  community.openwrt.command:
    cmd: grep -Fxq /etc/cve_2026_98432.nft /etc/sysupgrade.conf
  register: router_cve_2026_98432_sysupgrade_entry
  changed_when: false
  failed_when: false
  check_mode: false

- name: Initialize the mitigation table probe result
  ansible.builtin.set_fact:
    router_cve_2026_98432_active_table:
      rc: 1
      stdout: ''
      stderr: Runtime table inspection was skipped.

- name: Check for an existing mitigation table
  community.openwrt.command:
    cmd: nft list table ip cve_2026_98432
  register: router_cve_2026_98432_active_table
  changed_when: false
  failed_when: false
  check_mode: false
  when: router_cve_2026_98432_apply_runtime_changes | bool

- name: Validate the mitigation table probe result
  ansible.builtin.assert:
    that:
      - >-
        router_cve_2026_98432_active_table.rc == 0
        or router_cve_2026_98432_active_table.stderr
           is search('No such file or directory')
    fail_msg: >-
      Unable to inspect the mitigation table. Refusing to assume it is absent.
  when: router_cve_2026_98432_apply_runtime_changes | bool

- name: Refuse conflicting or unmanaged state
  ansible.builtin.assert:
    that:
      - >-
        router_cve_2026_98432_include.result | default('') == '' or
        router_cve_2026_98432_include.result == 'include'
      - >-
        router_cve_2026_98432_include.result | default('') != 'include' or
        (
          router_cve_2026_98432_include_options.results[0].result == 'nftables'
          and router_cve_2026_98432_include_options.results[1].result
              == '/etc/cve_2026_98432.nft'
          and router_cve_2026_98432_include_options.results[2].result
              == 'ruleset-post'
        )
      - >-
        router_cve_2026_98432_include.result == 'include' or
        (
          router_cve_2026_98432_file_exists.rc != 0
          and router_cve_2026_98432_sysupgrade_entry.rc != 0
          and router_cve_2026_98432_active_table.rc != 0
        )
    fail_msg: >-
      The named UCI section conflicts with this role, or mitigation state
      exists without the role-owned UCI include. Resolve it manually rather
      than overwriting or deleting unmanaged firewall state.

- name: Refuse configuration-only removal while the live mitigation exists
  ansible.builtin.assert:
    that:
      - >-
        router_cve_2026_98432_state != 'absent'
        or router_cve_2026_98432_apply_runtime_changes | bool
    fail_msg: >-
      Configuration-only removal is unsafe because the live nftables table
      cannot be inspected. Enable runtime changes to verify and remove it
      without orphaning an active packet filter.

- name: Back up the current mitigation file when present
  community.openwrt.slurp:
    src: /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_ruleset_backup
  changed_when: false
  when: router_cve_2026_98432_file_exists.rc == 0 and router_cve_2026_98432_file_is_regular.rc == 0

- name: Apply the requested mitigation state
  block:
    - name: Install the owned nftables ruleset
      community.openwrt.copy:
        src: mitigation.nft
        dest: /etc/cve_2026_98432.nft
        owner: root
        group: root
        mode: '0644'
      register: router_cve_2026_98432_ruleset_install
      when: router_cve_2026_98432_state == 'present'

    - name: Configure the dedicated fw4 ruleset include
      community.openwrt.uci:
        command: section
        config: firewall
        type: include
        name: ansible_cve_2026_98432
        value:
          type: nftables
          path: /etc/cve_2026_98432.nft
          position: ruleset-post
          enabled: '1'
        autocommit: true
      register: router_cve_2026_98432_include_install
      when: router_cve_2026_98432_state == 'present'

    - name: Preserve the owned ruleset through sysupgrade
      community.openwrt.lineinfile:
        path: /etc/sysupgrade.conf
        line: /etc/cve_2026_98432.nft
        regexp: '^/etc/cve_2026_98432\.nft$'
        create: true
        state: present
      register: router_cve_2026_98432_sysupgrade_install
      when: router_cve_2026_98432_state == 'present'

    - name: Remove the dedicated fw4 include
      community.openwrt.uci:
        command: absent
        key: firewall.ansible_cve_2026_98432
        autocommit: true
      register: router_cve_2026_98432_include_remove
      when:
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_include.result | default('') == 'include'

    - name: Remove the sysupgrade preservation entry
      community.openwrt.lineinfile:
        path: /etc/sysupgrade.conf
        line: /etc/cve_2026_98432.nft
        regexp: '^/etc/cve_2026_98432\.nft$'
        state: absent
      register: router_cve_2026_98432_sysupgrade_remove
      when:
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_sysupgrade_entry.rc == 0

    - name: Remove the owned nftables file
      community.openwrt.file:
        path: /etc/cve_2026_98432.nft
        state: absent
      register: router_cve_2026_98432_ruleset_remove
      when:
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_include.result | default('') == 'include'

    - name: Determine whether the firewall needs a reload
      ansible.builtin.set_fact:
        router_cve_2026_98432_reload_required: >-
          {{
            router_cve_2026_98432_ruleset_install.changed | default(false)
            or router_cve_2026_98432_include_install.changed | default(false)
            or router_cve_2026_98432_sysupgrade_install.changed | default(false)
            or router_cve_2026_98432_include_remove.changed | default(false)
            or router_cve_2026_98432_sysupgrade_remove.changed | default(false)
            or router_cve_2026_98432_ruleset_remove.changed | default(false)
            or (
              router_cve_2026_98432_state == 'present' and (
                router_cve_2026_98432_active_table.rc != 0
                or router_cve_2026_98432_active_table.stdout is not search(
                  '(?s)chain pre\s*\{[^}]*type filter hook prerouting '
                  ~ 'priority (-310|raw - 10);[^}]*'
                  ~ 'ip protocol tcp ip hdrlength 6-15 counter.*drop'
                )
                or router_cve_2026_98432_active_table.stdout is search(
                  'flags.*dormant'
                )
              )
            )
            or (
              router_cve_2026_98432_state == 'absent'
              and router_cve_2026_98432_active_table.rc == 0
            )
          }}
      changed_when: false

    - name: Validate the resulting fw4 ruleset before reload
      community.openwrt.command:
        cmd: fw4 check
      changed_when: false
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Reload firewall after applying the mitigation
      community.openwrt.service:
        name: firewall
        state: reloaded
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_reload_required | bool

    - name: Remove the now-unreferenced nftables table
      community.openwrt.command:
        cmd: nft delete table ip cve_2026_98432
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_active_table.rc == 0

    - name: Read the active mitigation table
      community.openwrt.command:
        cmd: nft list table ip cve_2026_98432
      register: router_cve_2026_98432_active_rules
      changed_when: false
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'present'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Verify the active mitigation rule
      ansible.builtin.assert:
        that:
          - >-
            router_cve_2026_98432_active_rules.stdout is not search(
              'flags.*dormant'
            )
          - >-
            router_cve_2026_98432_active_rules.stdout is search(
              '(?s)chain pre\s*\{[^}]*type filter hook prerouting '
              ~ 'priority (-310|raw - 10);[^}]*'
              ~ 'ip protocol tcp ip hdrlength 6-15 counter.*drop'
            )
        fail_msg: The expected CVE mitigation is not active in nftables.
      when:
        - router_cve_2026_98432_state == 'present'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Inventory nftables tables after removal
      community.openwrt.command:
        cmd: nft list tables
      register: router_cve_2026_98432_tables_after_removal
      changed_when: false
      check_mode: false
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Verify the mitigation table is absent after removal
      ansible.builtin.assert:
        that:
          - router_cve_2026_98432_tables_after_removal.rc == 0
          - >-
            router_cve_2026_98432_tables_after_removal.stdout
            is not search('(?m)^table ip cve_2026_98432$')
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_apply_runtime_changes | bool

  rescue:
    - name: Check for concurrent firewall UCI changes before rollback
      community.openwrt.command:
        cmd: uci changes firewall
      register: router_cve_2026_98432_rollback_pending_changes
      changed_when: false
      check_mode: false

    - name: Refuse rollback over concurrent firewall UCI changes
      ansible.builtin.assert:
        that:
          - router_cve_2026_98432_rollback_pending_changes.stdout | trim == ''
        fail_msg: >-
          Mitigation update failed, and unrelated firewall UCI changes are
          pending. Automatic UCI rollback was stopped to avoid committing or
          discarding operator changes; inspect the firewall manually.

    - name: Restore the previous owned UCI include
      community.openwrt.uci:
        command: section
        config: firewall
        type: include
        name: ansible_cve_2026_98432
        value:
          type: "{{ router_cve_2026_98432_include_options.results[0].result }}"
          path: "{{ router_cve_2026_98432_include_options.results[1].result }}"
          position: >-
            {{ router_cve_2026_98432_include_options.results[2].result }}
          enabled: >-
            {{ router_cve_2026_98432_include_options.results[3].result
               | default('1', true) }}
        autocommit: true
      when: router_cve_2026_98432_include.result | default('') == 'include'

    - name: Remove the UCI include created by the failed run
      community.openwrt.uci:
        command: absent
        key: firewall.ansible_cve_2026_98432
        autocommit: true
      when: router_cve_2026_98432_include.result | default('') != 'include'

    - name: Restore the previous mitigation file
      community.openwrt.copy:
        content: >-
          {{ router_cve_2026_98432_ruleset_backup.content | b64decode }}
        dest: /etc/cve_2026_98432.nft
        owner: root
        group: root
        mode: '0644'
      when: router_cve_2026_98432_file_exists.rc == 0 and router_cve_2026_98432_file_is_regular.rc == 0

    - name: Remove the mitigation file created by the failed run
      community.openwrt.file:
        path: /etc/cve_2026_98432.nft
        state: absent
      when: router_cve_2026_98432_file_exists.rc != 0

    - name: Restore only the owned sysupgrade preservation entry
      community.openwrt.lineinfile:
        path: /etc/sysupgrade.conf
        line: /etc/cve_2026_98432.nft
        regexp: '^/etc/cve_2026_98432\.nft$'
        create: true
        state: >-
          {{ 'present' if router_cve_2026_98432_sysupgrade_entry.rc == 0
             else 'absent' }}

    - name: Check whether sysupgrade configuration is empty after rollback
      community.openwrt.command:
        cmd: test -s /etc/sysupgrade.conf
      register: router_cve_2026_98432_sysupgrade_nonempty
      changed_when: false
      failed_when: false
      check_mode: false
      when: router_cve_2026_98432_sysupgrade_file_exists.rc != 0

    - name: Remove an empty sysupgrade file created by the failed run
      community.openwrt.file:
        path: /etc/sysupgrade.conf
        state: absent
      when:
        - router_cve_2026_98432_sysupgrade_file_exists.rc != 0
        - router_cve_2026_98432_sysupgrade_nonempty.rc != 0

    - name: Reload the restored firewall configuration
      community.openwrt.service:
        name: firewall
        state: reloaded
      register: router_cve_2026_98432_rollback_reload
      when: router_cve_2026_98432_apply_runtime_changes | bool
      ignore_errors: true

    - name: Remove a mitigation table introduced by the failed run
      community.openwrt.command:
        cmd: nft delete table ip cve_2026_98432
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_active_table.rc != 0
      failed_when: false

    - name: Inventory nftables tables after rollback
      community.openwrt.command:
        cmd: nft list tables
      register: router_cve_2026_98432_tables_after_rollback
      changed_when: false
      check_mode: false
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_active_table.rc != 0

    - name: Verify rollback removed a table introduced by this run
      ansible.builtin.assert:
        that:
          - router_cve_2026_98432_tables_after_rollback.rc == 0
          - >-
            router_cve_2026_98432_tables_after_rollback.stdout
            is not search('(?m)^table ip cve_2026_98432$')
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_active_table.rc != 0

    - name: Stop after reporting the recovery outcome
      ansible.builtin.fail:
        msg: >-
          CVE mitigation update failed. The previous owned UCI include,
          ruleset file, and sysupgrade entry were restored.
          {% if not (router_cve_2026_98432_apply_runtime_changes | bool) %}
          Runtime recovery was skipped because runtime changes are disabled.
          {% elif router_cve_2026_98432_rollback_reload is defined
                  and
                  router_cve_2026_98432_rollback_reload.failed
                  | default(false) %}
          The firewall recovery reload failed; inspect the live firewall.
          {% else %}
          The firewall recovery reload completed successfully.
          {% endif %}
          Any mitigation table absent before this run was also removed.
