# roles/router_cve_2026_98432/tasks/manage.yml
---
- name: Validate requested mitigation state
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_state in ['present', 'absent']
      - router_cve_2026_98432_apply_runtime_changes is boolean
    fail_msg: >-
      State must be present or absent and runtime changes must be boolean.

- name: Check firewall4 availability
  community.openwrt.command:
    cmd: /sbin/fw4 --help
  changed_when: false
  check_mode: false

- name: Check for pending firewall UCI changes
  community.openwrt.command:
    cmd: uci changes firewall
  register: router_cve_2026_98432_pending_changes
  changed_when: false
  check_mode: false

- name: Refuse to commit unrelated firewall UCI changes
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_pending_changes.stdout | trim == ''
    fail_msg: >-
      Commit or discard pending firewall UCI changes before managing the
      mitigation.

- name: Read the owned UCI include
  community.openwrt.uci:
    command: get
    key: firewall.ansible_cve_2026_98432
  register: router_cve_2026_98432_include
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the owned UCI include options
  community.openwrt.uci:
    command: get
    key: "firewall.ansible_cve_2026_98432.{{ item }}"
  loop:
    - type
    - path
    - position
    - enabled
  register: router_cve_2026_98432_include_options
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the owned ruleset path is a symlink
  community.openwrt.command:
    cmd: test -L /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_file_is_symlink
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the owned ruleset path exists
  community.openwrt.command:
    cmd: test -e /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_file_exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the owned ruleset path is a regular file
  community.openwrt.command:
    cmd: test -f /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_file_is_regular
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse an unmanaged object at the owned ruleset path
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_file_is_symlink.rc != 0
      - >-
        router_cve_2026_98432_file_exists.rc != 0
        or router_cve_2026_98432_file_is_regular.rc == 0
    fail_msg: >-
      The owned ruleset path is not a regular file; refusing to overwrite or
      remove it.

- name: Check whether sysupgrade already preserves the ruleset
  community.openwrt.command:
    cmd: grep -Fxq /etc/cve_2026_98432.nft /etc/sysupgrade.conf
  register: router_cve_2026_98432_sysupgrade_entry
  changed_when: false
  failed_when: false
  check_mode: false

- name: Initialize the runtime table probe
  ansible.builtin.set_fact:
    router_cve_2026_98432_active_table:
      rc: 1
      stdout: ''
      stderr: Runtime inspection skipped.

- name: Check for an existing mitigation table
  community.openwrt.command:
    cmd: "{{ router_cve_2026_98432_runtime_table_probe_command }}"
  register: router_cve_2026_98432_active_table
  changed_when: false
  failed_when: false
  check_mode: false
  when: router_cve_2026_98432_apply_runtime_changes | bool

- name: Verify the runtime table probe was conclusive
  ansible.builtin.assert:
    that:
      - >-
        router_cve_2026_98432_active_table.rc == 0
        or router_cve_2026_98432_active_table.stderr is search(
          'No such file or directory'
        )
    fail_msg: >-
      Unable to inspect the mitigation table; refusing to assume it is absent.
  when: router_cve_2026_98432_apply_runtime_changes | bool

- name: Define the expected active nftables rule
  ansible.builtin.set_fact:
    router_cve_2026_98432_rule_pattern: >-
      (?s)chain pre \\{[^}]*type filter hook prerouting
      priority (?:-310|raw - 10);
      [^}]*ip protocol tcp ip hdrlength 6-15 counter
      (?: packets [0-9]+ bytes [0-9]+)? drop

- name: Refuse an unexpected or conflicting mitigation state
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_include.result | default('') in ['', 'include']
      - >-
        router_cve_2026_98432_include.result | default('') != 'include'
        or (
          router_cve_2026_98432_include_options.results[0].result == 'nftables'
          and router_cve_2026_98432_include_options.results[1].result
              == '/etc/cve_2026_98432.nft'
          and router_cve_2026_98432_include_options.results[2].result
              == 'ruleset-post'
        )
      - >-
        router_cve_2026_98432_include.result != 'include'
        or router_cve_2026_98432_active_table.rc != 0
        or router_cve_2026_98432_include_options.results[3].result != '0'
        or router_cve_2026_98432_active_table.stdout is search(
          router_cve_2026_98432_rule_pattern
        )
      - >-
        router_cve_2026_98432_include.result == 'include'
        or (
          router_cve_2026_98432_file_exists.rc != 0
          and router_cve_2026_98432_sysupgrade_entry.rc != 0
          and (
            not (router_cve_2026_98432_apply_runtime_changes | bool)
            or router_cve_2026_98432_active_table.rc != 0
          )
        )
    fail_msg: >-
      Existing state conflicts with this role or is not owned by it; resolve
      it manually.

- name: Capture the complete owned UCI include
  ansible.builtin.raw: >-
    uci export firewall |
    sed -n "/^config .* 'ansible_cve_2026_98432'$/,/^$/p"
  register: router_cve_2026_98432_include_export
  changed_when: false
  when: router_cve_2026_98432_include.result | default('') == 'include'

- name: Verify the owned UCI include backup is complete
  ansible.builtin.assert:
    that:
      - router_cve_2026_98432_include_export.stdout | trim != ''
  when: router_cve_2026_98432_include.result | default('') == 'include'

- name: Refuse removal when runtime changes are disabled
  ansible.builtin.assert:
    that:
      - >-
        router_cve_2026_98432_state != 'absent'
        or router_cve_2026_98432_apply_runtime_changes | bool
    fail_msg: >-
      Removal requires runtime inspection and cleanup; enable
      router_cve_2026_98432_apply_runtime_changes.

- name: Back up the existing ruleset
  community.openwrt.slurp:
    src: /etc/cve_2026_98432.nft
  register: router_cve_2026_98432_ruleset_backup
  changed_when: false
  when: router_cve_2026_98432_file_exists.rc == 0

- name: Back up the active mitigation table
  community.openwrt.copy:
    content: "{{ router_cve_2026_98432_active_table.stdout }}"
    dest: /tmp/ansible-cve-2026-98432-previous.nft
    owner: root
    group: root
    mode: '0600'
  when:
    - router_cve_2026_98432_apply_runtime_changes | bool
    - router_cve_2026_98432_active_table.rc == 0

- name: Record whether sysupgrade configuration exists
  community.openwrt.command:
    cmd: test -f /etc/sysupgrade.conf
  register: router_cve_2026_98432_sysupgrade_file_exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Back up the previous sysupgrade configuration
  community.openwrt.slurp:
    src: /etc/sysupgrade.conf
  register: router_cve_2026_98432_sysupgrade_backup
  changed_when: false
  when: router_cve_2026_98432_sysupgrade_file_exists.rc == 0

- name: Reset the runtime recovery marker for this invocation
  ansible.builtin.set_fact:
    router_cve_2026_98432_runtime_reload_attempted: false

- name: Apply the requested mitigation state
  block:
    - name: Install the nftables ruleset
      community.openwrt.copy:
        src: mitigation.nft
        dest: /etc/cve_2026_98432.nft
        owner: root
        group: root
        mode: '0644'
      register: router_cve_2026_98432_ruleset_change
      when: router_cve_2026_98432_state == 'present'

    - name: Configure the fw4 ruleset include
      community.openwrt.uci:
        command: section
        config: firewall
        type: include
        name: ansible_cve_2026_98432
        value:
          type: nftables
          path: /etc/cve_2026_98432.nft
          position: ruleset-post
          enabled: >-
            {{
              '1'
              if router_cve_2026_98432_apply_runtime_changes | bool
              else (
                router_cve_2026_98432_include_options.results[3].result
                | default('0', true)
              )
            }}
        autocommit: true
      register: router_cve_2026_98432_include_change
      when: router_cve_2026_98432_state == 'present'

    - name: Preserve the ruleset through sysupgrade
      community.openwrt.lineinfile:
        path: /etc/sysupgrade.conf
        line: /etc/cve_2026_98432.nft
        regexp: '^/etc/cve_2026_98432\.nft$'
        create: true
        state: present
      register: router_cve_2026_98432_sysupgrade_change
      when: router_cve_2026_98432_state == 'present'

    - name: Count owned sysupgrade entries
      community.openwrt.command:
        cmd: grep -Fxc /etc/cve_2026_98432.nft /etc/sysupgrade.conf
      register: router_cve_2026_98432_sysupgrade_entry_count
      changed_when: false
      failed_when: false
      when: router_cve_2026_98432_state == 'present'

    - name: Collapse duplicate owned sysupgrade entries
      ansible.builtin.raw: >-
        awk '$0 != "/etc/cve_2026_98432.nft" || !seen++'
        /etc/sysupgrade.conf > /tmp/ansible-cve-2026-98432-sysupgrade.conf &&
        cat /tmp/ansible-cve-2026-98432-sysupgrade.conf
        > /etc/sysupgrade.conf &&
        rm -f /tmp/ansible-cve-2026-98432-sysupgrade.conf
      changed_when: true
      when:
        - router_cve_2026_98432_state == 'present'
        - router_cve_2026_98432_sysupgrade_entry_count.stdout | int > 1

    - name: Remove the fw4 include
      community.openwrt.uci:
        command: absent
        key: firewall.ansible_cve_2026_98432
        autocommit: true
      register: router_cve_2026_98432_include_removed
      when:
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_include.result | default('') == 'include'

    - name: Remove the sysupgrade entry
      community.openwrt.lineinfile:
        path: /etc/sysupgrade.conf
        line: /etc/cve_2026_98432.nft
        regexp: '^/etc/cve_2026_98432\.nft$'
        state: absent
      register: router_cve_2026_98432_sysupgrade_removed
      when:
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_sysupgrade_entry.rc == 0

    - name: Remove the owned ruleset file
      community.openwrt.file:
        path: /etc/cve_2026_98432.nft
        state: absent
      register: router_cve_2026_98432_ruleset_removed
      when:
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_include.result | default('') == 'include'

    - name: Reload fw4 when managed configuration changed
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_apply_runtime_changes | bool
        - >-
          router_cve_2026_98432_ruleset_change.changed | default(false)
          or router_cve_2026_98432_include_change.changed | default(false)
          or router_cve_2026_98432_sysupgrade_change.changed | default(false)
          or router_cve_2026_98432_ruleset_removed.changed | default(false)
          or router_cve_2026_98432_include_removed.changed | default(false)
          or router_cve_2026_98432_sysupgrade_removed.changed | default(false)
          or (
            router_cve_2026_98432_state == 'present'
            and (
              router_cve_2026_98432_active_table.rc != 0
              or router_cve_2026_98432_active_table.stdout is not search(
                router_cve_2026_98432_rule_pattern
              )
              or router_cve_2026_98432_active_table.stdout is search(
                'flags.*dormant'
              )
            )
          )
      block:
        - name: Validate the resulting fw4 ruleset
          community.openwrt.command:
            cmd: "{{ router_cve_2026_98432_fw4_check_command }}"
          changed_when: false

        - name: Record that a firewall reload is about to be attempted
          ansible.builtin.set_fact:
            router_cve_2026_98432_runtime_reload_attempted: true

        - name: Reload the firewall
          community.openwrt.service:
            name: firewall
            state: reloaded

    - name: Remove the standalone nftables table
      community.openwrt.command:
        cmd: nft delete table ip cve_2026_98432
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_active_table.rc == 0

    - name: Verify the mitigation table is absent after removal
      community.openwrt.command:
        cmd: nft list tables
      register: router_cve_2026_98432_tables_after_removal
      changed_when: false
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Assert the mitigation table was removed
      ansible.builtin.assert:
        that:
          - router_cve_2026_98432_tables_after_removal.rc == 0
          - >-
            router_cve_2026_98432_tables_after_removal.stdout
            is not search('(?m)^table ip cve_2026_98432$')
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'absent'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Read the active mitigation table
      community.openwrt.command:
        cmd: nft list table ip cve_2026_98432
      register: router_cve_2026_98432_active_rules
      changed_when: false
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'present'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Verify the mitigation rule is active
      ansible.builtin.assert:
        that:
          - >-
            router_cve_2026_98432_active_rules.stdout is search(
              router_cve_2026_98432_rule_pattern
            )
          - >-
            router_cve_2026_98432_active_rules.stdout is not search(
              'flags.*dormant'
            )
        fail_msg: The expected CVE mitigation rule is not active in nftables.
      when:
        - not ansible_check_mode
        - router_cve_2026_98432_state == 'present'
        - router_cve_2026_98432_apply_runtime_changes | bool

    - name: Remove the temporary runtime snapshot after success
      community.openwrt.file:
        path: /tmp/ansible-cve-2026-98432-previous.nft
        state: absent
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_active_table.rc == 0

  rescue:
    - name: Stage the complete previous UCI include for recovery
      community.openwrt.copy:
        content: "{{ router_cve_2026_98432_include_export.stdout }}"
        dest: /tmp/ansible-cve-2026-98432-previous.uci
        owner: root
        group: root
        mode: '0600'
      when: router_cve_2026_98432_include.result | default('') == 'include'

    - name: Restore the complete previous UCI include
      ansible.builtin.raw: >-
        uci -q delete firewall.ansible_cve_2026_98432 &&
        uci import firewall < /tmp/ansible-cve-2026-98432-previous.uci &&
        uci commit firewall
      changed_when: true
      when: router_cve_2026_98432_include.result | default('') == 'include'

    - name: Remove the temporary UCI recovery file
      community.openwrt.file:
        path: /tmp/ansible-cve-2026-98432-previous.uci
        state: absent
      when: router_cve_2026_98432_include.result | default('') == 'include'

    - name: Remove an include created by the failed run
      community.openwrt.uci:
        command: absent
        key: firewall.ansible_cve_2026_98432
        autocommit: true
      when: router_cve_2026_98432_include.result | default('') != 'include'

    - name: Restore the previous ruleset file
      community.openwrt.copy:
        content: >-
          {{ router_cve_2026_98432_ruleset_backup.content | b64decode }}
        dest: /etc/cve_2026_98432.nft
        owner: root
        group: root
        mode: '0644'
      when: router_cve_2026_98432_file_exists.rc == 0

    - name: Remove a ruleset file created by the failed run
      community.openwrt.file:
        path: /etc/cve_2026_98432.nft
        state: absent
      when: router_cve_2026_98432_file_exists.rc != 0

    - name: Restore the previous sysupgrade configuration
      community.openwrt.copy:
        content: >-
          {{ router_cve_2026_98432_sysupgrade_backup.content | b64decode }}
        dest: /etc/sysupgrade.conf
      when: router_cve_2026_98432_sysupgrade_file_exists.rc == 0

    - name: Remove sysupgrade configuration created by the failed run
      community.openwrt.file:
        path: /etc/sysupgrade.conf
        state: absent
      when: router_cve_2026_98432_sysupgrade_file_exists.rc != 0

    - name: Reload the restored firewall configuration
      community.openwrt.service:
        name: firewall
        state: reloaded
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
      failed_when: false

    - name: Restore the previously active mitigation table
      ansible.builtin.raw: |
        nft delete table ip cve_2026_98432 2>/dev/null || true
        nft -f /tmp/ansible-cve-2026-98432-previous.nft
      changed_when: true
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
        - router_cve_2026_98432_active_table.rc == 0
      failed_when: false

    - name: Remove a table created by the failed run
      community.openwrt.command:
        cmd: nft delete table ip cve_2026_98432
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
        - router_cve_2026_98432_active_table.rc != 0
      failed_when: false

    - name: Read the restored previously active mitigation table
      community.openwrt.command:
        cmd: nft list table ip cve_2026_98432
      register: router_cve_2026_98432_restored_table
      changed_when: false
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
        - router_cve_2026_98432_active_table.rc == 0

    - name: Verify the previous mitigation table was restored
      ansible.builtin.assert:
        that:
          - router_cve_2026_98432_restored_table.rc == 0
          - >-
            router_cve_2026_98432_restored_table.stdout
            is search(router_cve_2026_98432_rule_pattern)
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
        - router_cve_2026_98432_active_table.rc == 0

    - name: Read nftables tables after failed installation recovery
      community.openwrt.command:
        cmd: nft list tables
      register: router_cve_2026_98432_tables_after_recovery
      changed_when: false
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
        - router_cve_2026_98432_active_table.rc != 0

    - name: Verify no mitigation table remains after failed installation
      ansible.builtin.assert:
        that:
          - router_cve_2026_98432_tables_after_recovery.rc == 0
          - >-
            router_cve_2026_98432_tables_after_recovery.stdout
            is not search('(?m)^table ip cve_2026_98432
    - name: Remove the temporary runtime snapshot after recovery
      community.openwrt.file:
        path: /tmp/ansible-cve-2026-98432-previous.nft
        state: absent
      when: router_cve_2026_98432_apply_runtime_changes | bool

    - name: Report the failed mitigation update
      ansible.builtin.fail:
        msg: >-
          CVE mitigation update failed. The previous owned UCI include,
          ruleset file, and sysupgrade entry were restored. Inspect the live
          firewall if the recovery reload or table cleanup failed.
)
      when:
        - router_cve_2026_98432_apply_runtime_changes | bool
        - router_cve_2026_98432_runtime_reload_attempted | default(false) | bool
        - router_cve_2026_98432_active_table.rc != 0

    - name: Remove the temporary runtime snapshot after recovery
      community.openwrt.file:
        path: /tmp/ansible-cve-2026-98432-previous.nft
        state: absent
      when: router_cve_2026_98432_apply_runtime_changes | bool

    - name: Report the failed mitigation update
      ansible.builtin.fail:
        msg: >-
          CVE mitigation update failed. The previous owned UCI include,
          ruleset file, and sysupgrade entry were restored. Inspect the live
          firewall if the recovery reload or table cleanup failed.
