# roles/router_cve_2026_98432/tasks/main.yml
---
- name: Acquire the CVE mitigation lifecycle lock
  community.openwrt.command:
    cmd: mkdir /tmp/ansible-cve-2026-98432.lock
  register: router_cve_2026_98432_lock
  changed_when: true
  check_mode: false
  failed_when: router_cve_2026_98432_lock.rc != 0

- name: Run the serialized CVE mitigation lifecycle
  block:
    - name: Manage CVE mitigation state
      ansible.builtin.include_tasks: manage.yml
  always:
    - name: Release the CVE mitigation lifecycle lock
      community.openwrt.command:
        cmd: rmdir /tmp/ansible-cve-2026-98432.lock
      when:
        - router_cve_2026_98432_lock is defined
        - router_cve_2026_98432_lock.rc == 0
      changed_when: false
      failed_when: false
