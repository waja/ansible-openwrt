# roles/router_packages/defaults/main.yml
---
router_packages_managed_services: []

router_packages_list:
  - busybox
  - openwrt-keyring
  - muninlite
  - rsync
  - uhttpd
  - uhttpd-mod-ubus
  - rpcd

# Map managed service names to the packages that provide them.
# A service may require multiple packages, and names may differ.
router_packages_service_package_map:
  snmpd:
    - snmpd
  xinetd:
    - xinetd
  tailscale:
    - tailscale
