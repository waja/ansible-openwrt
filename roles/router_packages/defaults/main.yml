---
router_packages_list:
  - busybox
  - openwrt-keyring
  - snmpd
  - muninlite
  - rsync
  - uhttpd
  - uhttpd-mod-ubus
  - rpcd
  - xinetd

router_packages_required_services:
  - snmpd
  - xinetd

router_service_restart_pending_file: /etc/.router-packages-restart-pending
router_service_restart_lock_dir: /etc/.router-packages-restart-lock
router_service_restart_lock_timeout: 120
