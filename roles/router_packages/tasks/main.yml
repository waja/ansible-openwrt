# roles/router_packages/tasks/main.yml
---
- name: Acquire the shared service restart lock
  ansible.builtin.raw: |
    lock_root=/root/.ansible-locks
    lock="$lock_root/router-packages-restart-lock"
    timeout={{ router_packages_service_restart_lock_timeout | int }}
    stale_after=1800
    waited=0
    umask 077
    mkdir -p "$lock_root" && chmod 700 "$lock_root" || exit 1
    until mkdir "$lock" 2>/dev/null; do
      now=$(date +%s)
      modified=$(stat -c %Y "$lock" 2>/dev/null || echo "$now")
      age=$((now - modified))
      if [ "$age" -ge "$stale_after" ]; then
        stale="$lock.stale.$now.$"
        if mv "$lock" "$stale" 2>/dev/null; then
          rmdir "$stale" 2>/dev/null || rm -rf "$stale"
          continue
        fi
      fi
      if [ "$waited" -ge "$timeout" ]; then
        echo "Timed out waiting for service restart lock: $lock" >&2
        exit 1
      fi
      sleep 1
      waited=$((waited + 1))
    done
  changed_when: false

- name: Install requested and required service packages
  block:
    - name: Check for a pending service restart from an earlier run
      community.openwrt.stat:
        path: /tmp/router-packages-restart-pending
      register: router_packages_pending_restart_stat

    - name: Mark services for restart before package installation
      community.openwrt.file:
        path: /tmp/router-packages-restart-pending
        state: touch
      when: not router_packages_pending_restart_stat.stat.exists
      changed_when: false

    - name: Install requested and required packages dynamically
      action: "community.openwrt.{{ openwrt_package_manager }}"
      args:
        name: >-
          {{ (router_packages_list + router_packages_required_services)
             | unique | join(',') }}
        state: present
        update_cache: true
      register: router_packages_install_result

    # Must run immediately after package installation: a handler could
    # run too late and leave stale completion markers for the next role.
    - name: Reset restart progress after package changes  # noqa: no-handler
      community.openwrt.file:
        path: /tmp/router-packages-restart-completed
        state: absent
      when: router_packages_install_result.changed

    - name: Clear restart marker when packages did not change
      community.openwrt.file:
        path: /tmp/router-packages-restart-pending
        state: absent
      when:
        - not router_packages_install_result.changed
        - not router_packages_pending_restart_stat.stat.exists
      changed_when: false
  always:
    - name: Release the shared service restart lock
      ansible.builtin.raw: >-
        rmdir /root/.ansible-locks/router-packages-restart-lock
      changed_when: false
