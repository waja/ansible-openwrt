# roles/router_network/tasks/validate_topology.yml
---
- name: Validate network topology container types
  ansible.builtin.assert:
    that:
      - (router_network_devices | type_debug) == 'list'
      - (router_network_bridge_vlans | type_debug) == 'list'
    fail_msg: >-
      router_network_devices and router_network_bridge_vlans must be lists.

- name: Validate network device definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.name is defined
      - item.name is string
      - item.name | length > 0
      - item.type is defined
      - item.type in ['bridge', '8021q']
      - >-
        item.type != 'bridge' or
        (item.ports is not defined or
         (item.ports | type_debug) == 'list')
      - >-
        item.type != 'bridge' or
        item.vlan_filtering is not defined or
        item.vlan_filtering is boolean
      - >-
        item.type != '8021q' or
        (item.ifname is defined and item.ifname is string and
         item.ifname | length > 0 and
         item.name != item.ifname and
         item.vid is defined and item.vid is integer and
         item.vid is not boolean and
         item.vid >= 1 and item.vid <= 4094)
    fail_msg: >-
      Each network device needs a non-empty name and a supported type
      ('bridge' or '8021q'). Bridges may define a list of ports;
      802.1Q devices require a parent ifname and an integer VID from 1 to 4094.
  loop: "{{ router_network_devices }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Validate unique network device names
  ansible.builtin.assert:
    that:
      - >-
        (router_network_devices | map(attribute='name') | list | length)
        ==
        (router_network_devices
         | map(attribute='name') | unique(case_sensitive=true) | list | length)
    fail_msg: "router_network_devices contains duplicate device names."
  when: router_network_devices | length > 0

- name: Validate unique 802.1Q parent and VLAN IDs
  ansible.builtin.assert:
    that:
      - >-
        (router_network_devices
         | selectattr('type', 'equalto', '8021q')
         | selectattr('ifname', 'equalto', item.ifname)
         | selectattr('vid', 'equalto', item.vid)
         | list | length) == 1
    fail_msg: >-
      802.1Q device '{{ item.name }}' duplicates the parent interface
      and VLAN ID of another 802.1Q device.
  loop: >-
    {{ router_network_devices
       | selectattr('type', 'equalto', '8021q') | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Validate declared 802.1Q parents precede their children
  ansible.builtin.assert:
    that:
      - >-
        (router_network_devices
         | selectattr('name', 'equalto', item.ifname)
         | selectattr('type', 'equalto', '8021q')
         | list | length == 0)
        or
        (router_network_devices
         | map(attribute='name') | list).index(item.ifname)
        <
        (router_network_devices
         | map(attribute='name') | list).index(item.name)
    fail_msg: >-
      802.1Q parent '{{ item.ifname }}' must be declared before child
      '{{ item.name }}' when both devices are in router_network_devices.
      This ordering prevents cyclic VLAN parent dependencies.
  loop: >-
    {{ router_network_devices
       | selectattr('type', 'equalto', '8021q') | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Validate bridge port definitions
  ansible.builtin.assert:
    that:
      - item.ports is not defined or (item.ports | type_debug) == 'list'
      - >-
        item.ports is not defined or
        (item.ports | select('string') | list | length)
        == item.ports | length
      - >-
        item.ports is not defined or
        (item.ports | reject('equalto', '') | list | length)
        == item.ports | length
      - item.ports is not defined or item.name not in item.ports
    fail_msg: >-
      Bridge '{{ item.name }}' must contain a list of non-empty string ports
      and cannot contain itself as a port.
  loop: >-
    {{ router_network_devices
       | selectattr('type', 'equalto', 'bridge') | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Validate unique bridge port names
  ansible.builtin.assert:
    that:
      - >-
        item.ports | length ==
        item.ports | unique(case_sensitive=true) | list | length
    fail_msg: "Bridge '{{ item.name }}' contains duplicate port names."
  loop: >-
    {{ router_network_devices
       | selectattr('type', 'equalto', 'bridge')
       | selectattr('ports', 'defined') | list }}
  loop_control:
    label: "{{ item.name }}"

- name: Validate bridge ports are assigned to only one bridge
  ansible.builtin.assert:
    that:
      - >-
        (router_network_devices
         | selectattr('type', 'equalto', 'bridge')
         | selectattr('ports', 'defined')
         | map(attribute='ports') | flatten | length)
        ==
        (router_network_devices
         | selectattr('type', 'equalto', 'bridge')
         | selectattr('ports', 'defined')
         | map(attribute='ports') | flatten
         | unique(case_sensitive=true) | list | length)
    fail_msg: >-
      A physical port cannot be assigned to more than one bridge.
  when: >-
    (router_network_devices
     | selectattr('type', 'equalto', 'bridge')
     | selectattr('ports', 'defined')
     | map(attribute='ports') | flatten | length) > 0

- name: Validate bridge VLAN definitions
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.device is defined
      - item.device is string
      - item.vlan is defined
      - item.vlan is integer
      - item.vlan is not boolean
      - item.vlan >= 1
      - item.vlan <= 4094
      - item.ports is defined
      - (item.ports | type_debug) == 'list'
      - item.local is not defined or item.local is boolean
    fail_msg: >-
      Each bridge VLAN needs a bridge device, a VLAN ID from 1 to 4094,
      a port list, and an optional boolean local flag.
  loop: "{{ router_network_bridge_vlans }}"
  loop_control:
    label: >-
      {{ item.device | default('unnamed') }} VLAN
      {{ item.vlan | default('?') }}

- name: Validate bridge VLAN port definitions
  ansible.builtin.assert:
    that:
      - >-
        (item.ports | select('mapping') | list | length)
        == item.ports | length
      - >-
        (item.ports
         | select('mapping')
         | selectattr('name', 'defined')
         | selectattr('name', 'string')
         | rejectattr('name', 'equalto', '')
         | list | length) == item.ports | length
      - >-
        (item.ports
         | select('mapping')
         | selectattr('mode', 'defined')
         | selectattr('mode', 'in', ['tagged', 'untagged'])
         | list | length) == item.ports | length
      - >-
        (item.ports
         | select('mapping')
         | selectattr('pvid', 'defined')
         | selectattr('pvid', 'boolean')
         | list | length)
        ==
        (item.ports
         | select('mapping')
         | selectattr('pvid', 'defined')
         | list | length)
      - >-
        (item.ports
         | select('mapping')
         | selectattr('pvid', 'defined')
         | selectattr('pvid', 'equalto', true)
         | rejectattr('mode', 'equalto', 'untagged')
         | list | length) == 0
    fail_msg: >-
      Bridge VLAN '{{ item.device }}' contains a port without a valid
      name, tagged/untagged mode, or boolean PVID setting. PVID membership
      must be untagged.
  loop: "{{ router_network_bridge_vlans }}"
  loop_control:
    label: "{{ item.device }} VLAN {{ item.vlan }}"

- name: Validate bridge VLAN references and membership
  ansible.builtin.assert:
    that:
      - >-
        item.device in
        (router_network_devices
         | selectattr('type', 'equalto', 'bridge')
         | map(attribute='name') | list)
      - >-
        (item.ports | map(attribute='name') | list | length)
        ==
        (item.ports | map(attribute='name')
         | unique(case_sensitive=true) | list | length)
      - >-
        item.ports | selectattr('mode', 'defined')
        | rejectattr('mode', 'in', ['tagged', 'untagged']) | list | length == 0
      - >-
        (item.ports | map(attribute='name') | list
         | difference(
             router_network_devices
             | selectattr('name', 'equalto', item.device)
             | map(attribute='ports') | first | default([])
           )
         | length) == 0
      - >-
        (router_network_devices
         | selectattr('name', 'equalto', item.device)
         | selectattr('vlan_filtering', 'defined')
         | selectattr('vlan_filtering', 'equalto', true)
         | list | length) == 1
    fail_msg: >-
      Bridge VLAN '{{ item.device }}' VLAN {{ item.vlan }} must reference a
      declared VLAN-aware bridge, use only declared bridge ports, have unique
      port names, and use tagged/untagged modes.
  loop: "{{ router_network_bridge_vlans }}"
  loop_control:
    label: "{{ item.device }} VLAN {{ item.vlan }}"

- name: Validate unique VLAN IDs per bridge
  ansible.builtin.assert:
    that:
      - >-
        (router_network_bridge_vlans
         | selectattr('device', 'equalto', item.device)
         | map(attribute='vlan') | list | length)
        ==
        (router_network_bridge_vlans
         | selectattr('device', 'equalto', item.device)
         | map(attribute='vlan') | unique | list | length)
    fail_msg: >-
      Bridge '{{ item.device }}' contains duplicate VLAN IDs.
  loop: "{{ router_network_bridge_vlans }}"
  loop_control:
    label: "{{ item.device }} VLAN {{ item.vlan }}"

- name: Validate unique PVID assignment per bridge port
  ansible.builtin.assert:
    that:
      - >-
        (item.ports
         | selectattr('pvid', 'defined')
         | selectattr('pvid', 'equalto', true)
         | map(attribute='name') | list
         | intersect(
             router_network_bridge_vlans
             | selectattr('device', 'equalto', item.device)
             | rejectattr('vlan', 'equalto', item.vlan)
             | map(attribute='ports') | flatten
             | selectattr('pvid', 'defined')
             | selectattr('pvid', 'equalto', true)
             | map(attribute='name') | list
           )
         | length) == 0
    fail_msg: >-
      A bridge port on '{{ item.device }}' is marked as PVID in more
      than one VLAN.
  loop: "{{ router_network_bridge_vlans }}"
  loop_control:
    label: "{{ item.device }} VLAN {{ item.vlan }}"
