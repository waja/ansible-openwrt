# roles/router_network/tasks/main.yml
---
- name: Read DHCP configuration sections
  community.openwrt.uci:
    command: show
    config: dhcp
  register: router_network_dhcp_config
  changed_when: false

- name: Extract DHCP section names
  ansible.builtin.set_fact:
    router_network_dhcp_sections: >-
      {{ router_network_dhcp_config.result
         | regex_findall('(?m)^dhcp\\.([^.=]+)=dhcp$') }}
  changed_when: false

- name: Build DHCP reconciliation operations
  ansible.builtin.set_fact:
    router_network_dhcp_operations: >-
      {{ (router_network_dhcp_operations | default([]))
         + [{
             'command': 'set',
             'key': 'dhcp.' ~ item ~ '.ignore',
             'value': (
               '1'
               if item in router_network_dhcp_disabled_interfaces
               else '0'
             )
           }] }}
  changed_when: false
  loop: "{{ router_network_dhcp_sections }}"

- name: Reconcile IPv4 DHCP settings in one UCI transaction
  community.openwrt.uci:
    autocommit: true
    operations: "{{ router_network_dhcp_operations | default([]) }}"
  notify: Restart dnsmasq
