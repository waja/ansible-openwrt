# roles/router_network/defaults/main.yml
---
# Explicit IPv4 DHCP status per DHCP configuration section.
# Supported values are "enabled" and "disabled".
# Unlisted sections are left untouched.
router_network_dhcp_interfaces: {}

# Timeouts for per-router reconciliation and service restart locks.
router_network_reconcile_lock_timeout: 120
router_network_service_restart_lock_timeout: 120
router_network_stale_lock_age: 1800
