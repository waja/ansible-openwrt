# .github/workflows/script-tests.yml
---
name: State discovery script tests

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - development
      - master

jobs:
  openwrt-versions:
    name: Read OpenWrt version matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read configured OpenWrt versions
        id: versions
        run: |
          set -euo pipefail
          versions="$(jq -ce \
            '.versions | select(type == "array" and length > 0)' \
            .github/openwrt-versions.json)"
          printf 'versions=%s\n' "$versions" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect script changes
    runs-on: ubuntu-latest
    outputs:
      script: ${{ steps.filter.outputs.script }}
    steps:
      - name: Check out code
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha
                || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # If the base commit is unavailable, run tests rather than risk
          # a false skip.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "script=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Force validation if the base object is missing or diffing fails.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "script=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --no-renames --name-only \
              "$BASE_SHA...$HEAD_SHA" \
              > "$RUNNER_TEMP/changed-files.txt"; then
              echo "script=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if ! git diff --no-renames --name-only \
              "$BASE_SHA" "$HEAD_SHA" \
              > "$RUNNER_TEMP/changed-files.txt"; then
              echo "script=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          cat "$RUNNER_TEMP/changed-files.txt"

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              scripts/*|\
                roles/router_storage/files/*|\
                roles/router_storage/tasks/*|\
                roles/router_storage/defaults/*|\
                .github/openwrt-versions.json|\
                .github/actions/openwrt-image/action.yml|\
                .github/workflows/script-tests.yml)
                relevant=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          echo "script=$relevant" >> "$GITHUB_OUTPUT"

  script-tests:
    name: State discovery script smoke test (${{ matrix.openwrt_version }})
    needs:
      - changes
      - openwrt-versions
    if: >-
      !cancelled()
      && needs['openwrt-versions'].result == 'success'
      && (
        github.event_name == 'workflow_dispatch'
        || needs.changes.result == 'failure'
        || (
          needs.changes.result == 'success'
          && needs.changes.outputs.script == 'true'
        )
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openwrt_version: >-
          ${{ fromJSON(needs['openwrt-versions'].outputs.versions) }}
    steps:
      - name: Check out code
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure and pull OpenWrt image
        uses: ./.github/actions/openwrt-image
        with:
          version: ${{ matrix.openwrt_version }}
          snapshot: 'false'

      - name: Verify APK system audit behavior on OpenWrt
        run: |
          docker run --rm \
            --entrypoint busybox \
            "$OPENWRT_IMAGE" \
            ash -c '
              set -eu

              # A clean rootfs must produce no findings and exit successfully.
              apk audit --system > /tmp/apk-audit-clean.txt
              test ! -s /tmp/apk-audit-clean.txt

              # Change a package-owned executable in place. This deliberately
              # exercises a case that .apk-new/.apk-old cannot detect.
              # Use a package-owned executable rather than BusyBox itself:
              # /bin/sh runs from BusyBox, so the binary is text-busy.
              audit_file=/sbin/uci
              test -f "$audit_file"
              test ! -L "$audit_file"
              owner=$(apk info --who-owns "$audit_file")
              package=${owner##* is owned by }
              test -n "$package"
              cp -p "$audit_file" /tmp/audit-file.original
              restore_audit_file() {
                cp -p /tmp/audit-file.original "$audit_file"
              }
              trap restore_audit_file EXIT HUP INT TERM
              printf x >> "$audit_file"

              if apk audit --system > /tmp/apk-audit-modified.txt; then
                audit_status=0
              else
                audit_status=$?
              fi
              test "$audit_status" -eq 0
              grep -Fx "U sbin/uci" /tmp/apk-audit-modified.txt

              if apk audit --system --packages \
                > /tmp/apk-audit-packages.txt; then
                packages_status=0
              else
                packages_status=$?
              fi
              test "$packages_status" -eq 0
              grep -F "$package" /tmp/apk-audit-packages.txt

              # Differences are findings, not command failures.
              test -s /tmp/apk-audit-modified.txt
              test -s /tmp/apk-audit-packages.txt
              restore_audit_file
              trap - EXIT HUP INT TERM

              apk audit --system > /tmp/apk-audit-restored.txt
              test ! -s /tmp/apk-audit-restored.txt
            '

      - name: Check shell syntax and command-line behavior
        run: |
          mkdir -p "$RUNNER_TEMP/owrt-test"
          cp scripts/owrt-extra.sh "$RUNNER_TEMP/owrt-test/owrt-extra.sh"
          cp roles/router_storage/files/detect.sh \
            "$RUNNER_TEMP/owrt-test/detect.sh"
          cp roles/router_storage/files/70-rootpt-resize \
            "$RUNNER_TEMP/owrt-test/70-rootpt-resize"
          cp roles/router_storage/files/80-rootfs-resize \
            "$RUNNER_TEMP/owrt-test/80-rootfs-resize"
          cp scripts/test-router-storage-detect.sh \
            "$RUNNER_TEMP/owrt-test/test.sh"
          cp scripts/tests/test-owrt-extra-cli.sh \
            "$RUNNER_TEMP/owrt-test/cli-tests.sh"
          docker run --rm \
            -v "$RUNNER_TEMP/owrt-test:/opt/owrt-test:ro" \
            --entrypoint busybox \
            "$OPENWRT_IMAGE" \
            ash -c '
              set -eux

              cp /opt/owrt-test/owrt-extra.sh /tmp/owrt-extra-test.sh
              busybox ash -n /tmp/owrt-extra-test.sh
              busybox ash -n /opt/owrt-test/detect.sh
              busybox ash -n /opt/owrt-test/70-rootpt-resize
              busybox ash -n /opt/owrt-test/80-rootfs-resize
              busybox ash -n /opt/owrt-test/test.sh
              busybox ash /opt/owrt-test/test.sh \
                /opt/owrt-test/detect.sh

              busybox ash /tmp/owrt-extra-test.sh -h > /tmp/help.txt
              grep -Eq -- "^[[:space:]#]*-k([[:space:]]|$)" /tmp/help.txt
              grep -Eq -- "^[[:space:]#]*-f([[:space:]]|$)" /tmp/help.txt
              grep -Eq -- "^[[:space:]#]*-H([[:space:]]|$)" /tmp/help.txt
              grep -Eq -- "^[[:space:]#]*-c([[:space:]]|$)" /tmp/help.txt
              grep -Fq -- "--redact-uci-diff FILE" /tmp/help.txt
              grep -Fq -- "--redact-text FILE" /tmp/help.txt
              grep -Eq -- "^[[:space:]#]*-h([[:space:]]|$)" /tmp/help.txt

              # Exercise redaction using representative UCI output.
              printf "%s\\n" \
                "< wireless.default_radio.key=wifi-secret" \
                "> network.wg0.private_key=wireguard-secret" \
                "> network.wg0.psk=psk-secret" \
                "> network.wg0.preshared_key=preshared-secret" \
                "> network.wg1.preshared-key=preshared-hyphen-secret" \
                "> network.wg0.secret_key=secret-key-value" \
                "> network.wg0.client-key=client-key-value" \
                "> network.wg0.public_key=public-value" \
                "> system.@system[0].hostname=router-name" \
                "> system.@user[0].password=\$1\$salt\$hash" \
                > /tmp/uci-fixture.txt
              cp /tmp/uci-fixture.txt /tmp/uci-fixture.original
              busybox ash /tmp/owrt-extra-test.sh --redact-uci-diff \
                /tmp/uci-fixture.txt > /tmp/uci-redacted.txt
              cmp -s /tmp/uci-fixture.txt /tmp/uci-fixture.original
              for secret in \
                wifi-secret wireguard-secret psk-secret \
                preshared-secret preshared-hyphen-secret \
                secret-key-value client-key-value salt hash; do
                if grep -Fq "$secret" /tmp/uci-redacted.txt; then
                  echo "Secret leaked by UCI redaction: $secret" >&2
                  exit 1
                fi
              done
              grep -Fq "[REDACTED]" /tmp/uci-redacted.txt
              grep -Fq "public-value" /tmp/uci-redacted.txt
              grep -Fq "router-name" /tmp/uci-redacted.txt

              # General text redaction: key/value names, auth headers, URL
              # credentials and multi-line PEM private keys. Input stays raw.
              cat > /tmp/sensitive-text.txt <<EOF_SENSITIVE
              api_token=api-token-secret
              oauth.secret: client-secret-value
              client_key=client-key-secret
              encryption_key=encryption-key-secret
              signing_key=signing-key-secret
              shared_key=shared-key-secret
              Authorization: Bearer bearer-token-secret
              authorization: Bearer lowercase-bearer-secret
              pRoXy-AuThOrIzAtIoN: Basic mixed-case-auth-secret
              Cookie: session=session-cookie-secret
              set-cookie: session=lowercase-cookie-secret
              repository=https://user:url-password-secret@example.invalid/feed
              -----BEGIN PRIVATE KEY-----
              private-key-line-one
              private-key-line-two
              -----END PRIVATE KEY-----
              -----BEGIN RSA PRIVATE KEY-----
              rsa-private-key-material
              -----END RSA PRIVATE KEY-----
              -----BEGIN EC PRIVATE KEY-----
              ec-private-key-material
              -----END EC PRIVATE KEY-----
              -----BEGIN ENCRYPTED PRIVATE KEY-----
              encrypted-private-key-material
              -----END ENCRYPTED PRIVATE KEY-----
              public_key=public-value
              hostname=router-name
              keyboard_layout=us
              monkey_count=3
              secretary_name=alice
              passenger_count=2
              EOF_SENSITIVE
              cp /tmp/sensitive-text.txt /tmp/sensitive-text.original
              busybox ash /tmp/owrt-extra-test.sh --redact-text \
                /tmp/sensitive-text.txt > /tmp/sensitive-text.redacted
              cmp -s /tmp/sensitive-text.txt /tmp/sensitive-text.original
              for secret in api-token-secret client-secret-value \
                client-key-secret encryption-key-secret signing-key-secret \
                shared-key-secret bearer-token-secret lowercase-bearer-secret \
                mixed-case-auth-secret session-cookie-secret \
                lowercase-cookie-secret url-password-secret \
                private-key-line-one private-key-line-two \
                rsa-private-key-material ec-private-key-material \
                encrypted-private-key-material; do
                if grep -Fq "$secret" /tmp/sensitive-text.redacted; then
                  echo "Sensitive text leaked: $secret" >&2
                  exit 1
                fi
              done
              grep -Fq "public-value" /tmp/sensitive-text.redacted
              grep -Fq "router-name" /tmp/sensitive-text.redacted
              grep -Fq "keyboard_layout=us" /tmp/sensitive-text.redacted
              grep -Fq "monkey_count=3" /tmp/sensitive-text.redacted
              grep -Fq "secretary_name=alice" /tmp/sensitive-text.redacted
              grep -Fq "passenger_count=2" /tmp/sensitive-text.redacted
              grep -Fq "[REDACTED PRIVATE KEY]" /tmp/sensitive-text.redacted

              # JSON keys and shell assignment prefixes must not bypass the
              # same heuristic used for plain key/value text.
              printf '%s%s\n' \
                '{"api_token": "json-api-token-secret",' \
                '"password": "json-password-secret"}' \
                > /tmp/json-shell-secrets.txt
              cat >> /tmp/json-shell-secrets.txt <<'EOF_JSON_SHELL'
              export PASSWORD=shell-password-secret
              readonly TOKEN=shell-token-secret
              local client_secret=shell-client-secret
              {"hostname": "router-name", "keyboard_layout": "us"}
              EOF_JSON_SHELL
              cp /tmp/json-shell-secrets.txt /tmp/json-shell-secrets.original
              busybox ash /tmp/owrt-extra-test.sh --redact-text \
                /tmp/json-shell-secrets.txt > /tmp/json-shell-secrets.redacted
              cmp -s /tmp/json-shell-secrets.txt \
                /tmp/json-shell-secrets.original
              for secret in json-api-token-secret json-password-secret \
                shell-password-secret shell-token-secret \
                shell-client-secret; do
                if grep -Fq "$secret" /tmp/json-shell-secrets.redacted; then
                  echo "JSON/shell secret leaked: $secret" >&2
                  exit 1
                fi
              done
              grep -Fq "router-name" /tmp/json-shell-secrets.redacted
              grep -Fq "keyboard_layout" /tmp/json-shell-secrets.redacted

              # Sensitive file classification is path-based; public keys and
              # ordinary public certificates are not treated as private keys.
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/passwd; then
                :
              else
                echo "Sensitive path not classified: etc/passwd" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/shadow; then
                :
              else
                echo "Sensitive path not classified: etc/shadow" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/dropbear/dropbear_ed25519_host_key; then
                :
              else
                echo "Sensitive path not classified:" \
                  "etc/dropbear/dropbear_ed25519_host_key" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/ssh/ssh_host_ed25519_key; then
                :
              else
                echo "Sensitive path not classified:" \
                  "etc/ssh/ssh_host_ed25519_key" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/uhttpd.key; then
                :
              else
                echo "Sensitive path not classified: etc/uhttpd.key" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/ssl/private/server.key; then
                :
              else
                echo "Sensitive path not classified:" \
                  "etc/ssl/private/server.key" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/wireguard/wg0.conf; then
                :
              else
                echo "Sensitive path not classified: etc/wireguard/wg0.conf" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/openvpn/client.key; then
                :
              else
                echo "Sensitive path not classified: etc/openvpn/client.key" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/ipsec.secrets; then
                :
              else
                echo "Sensitive path not classified: etc/ipsec.secrets" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/swanctl/private/key.pem; then
                :
              else
                echo "Sensitive path not classified:" \
                  "etc/swanctl/private/key.pem" >&2
                exit 1
              fi
              if ! busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                root/.ssh/id_ed25519; then
                :
              else
                echo "Sensitive path not classified: root/.ssh/id_ed25519" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/ssh/ssh_host_ed25519_key.pub; then
                echo "Non-secret path classified:" \
                  "etc/ssh/ssh_host_ed25519_key.pub" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/openvpn/ca.crt; then
                echo "Non-secret path classified: etc/openvpn/ca.crt" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/config/network; then
                echo "Non-secret path classified: etc/config/network" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                usr/share/example/document.key; then
                echo "Unrelated extension classified as sensitive:" \
                  "usr/share/example/document.key" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                usr/share/example/archive.p12; then
                echo "Unrelated extension classified as sensitive:" \
                  "usr/share/example/archive.p12" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                usr/share/example/backup.pfx; then
                echo "Unrelated extension classified as sensitive:" \
                  "usr/share/example/backup.pfx" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                etc/config/network.key; then
                echo "Unrelated extension classified as sensitive:" \
                  "etc/config/network.key" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                tmp/private.key; then
                echo "Unrelated extension classified as sensitive:" \
                  "tmp/private.key" >&2
                exit 1
              fi
              if busybox ash /tmp/owrt-extra-test.sh \
                --is-sensitive-path \
                usr/share/ca-certificates/root.pem.pub; then
                echo "Non-secret path classified:" \
                  "usr/share/ca-certificates/root.pem.pub" >&2
                exit 1
              fi

              busybox ash -n /opt/owrt-test/cli-tests.sh
              busybox ash /opt/owrt-test/cli-tests.sh \
                /tmp/owrt-extra-test.sh
            '

      - name: Test discovery failure handling
        run: |
          mkdir -p "$RUNNER_TEMP/owrt-test"
          cp scripts/owrt-extra.sh "$RUNNER_TEMP/owrt-test/owrt-extra.sh"
          cp scripts/tests/owrt-extra-failure-tests.sh \
            "$RUNNER_TEMP/owrt-test/failure-tests.sh"
          docker run --rm \
            -v "$RUNNER_TEMP/owrt-test:/opt/owrt-test:ro" \
            --entrypoint busybox \
            "$OPENWRT_IMAGE" \
            ash -c 'busybox ash -n /opt/owrt-test/failure-tests.sh && \
              busybox ash /opt/owrt-test/failure-tests.sh'
