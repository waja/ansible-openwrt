# .github/workflows/update-ci-lockfiles.yml
---
name: Validate CI dependency locks

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements/ci/*.in"
      - "requirements/ci/*.txt"
      - ".github/workflows/update-ci-lockfiles.yml"
      - "scripts/update-ci-lockfiles.sh"
  push:
    paths:
      - "requirements/ci/*.in"
      - "requirements/ci/*.txt"
      - ".github/workflows/update-ci-lockfiles.yml"
      - "scripts/update-ci-lockfiles.sh"

permissions:
  contents: read

jobs:
  validate-locks:
    name: Validate generated dependency locks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the pinned lockfile generator.
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-tools==7.6.2"

      - name: Regenerate all CI dependency locks.
        run: |
          bash scripts/update-ci-lockfiles.sh

      - name: Verify lockfiles are up to date.
        run: |
          if ! git diff --exit-code -- requirements/ci/*.txt; then
            echo "::error::CI dependency lockfiles are stale."
            echo "Update the .in inputs and regenerate the .txt files with:"
            echo "  bash scripts/update-ci-lockfiles.sh"
            exit 1
          fi
