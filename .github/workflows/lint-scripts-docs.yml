# .github/workflows/lint-scripts-docs.yml
---
name: Script and documentation lint

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - development
      - master

permissions:
  contents: read

jobs:
  changes:
    name: Detect script and documentation changes
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha
                || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Missing history must never cause a validation skip.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
            ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            echo "markdown=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --no-renames --name-only \
              "$BASE_SHA...$HEAD_SHA" \
              > "$RUNNER_TEMP/changed-files.txt"; then
              echo "scripts=true" >> "$GITHUB_OUTPUT"
              echo "markdown=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if ! git diff --no-renames --name-only \
              "$BASE_SHA" "$HEAD_SHA" \
              > "$RUNNER_TEMP/changed-files.txt"; then
              echo "scripts=true" >> "$GITHUB_OUTPUT"
              echo "markdown=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          cat "$RUNNER_TEMP/changed-files.txt"

          scripts=false
          markdown=false
          while IFS= read -r path; do
            case "$path" in
              scripts/*|.shellcheckrc)
                scripts=true
                ;;
              *.md|.markdownlint-cli2.jsonc|.codespellrc)
                markdown=true
                ;;
              .github/workflows/lint-scripts-docs.yml)
                scripts=true
                markdown=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "markdown=$markdown" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint scripts and Markdown
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch'
        || needs.changes.result == 'failure'
        || (
          needs.changes.result == 'success'
          && (
            needs.changes.outputs.scripts == 'true'
            || needs.changes.outputs.markdown == 'true'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        if: >-
          needs.changes.result != 'success'
          || needs.changes.outputs.scripts == 'true'
          || needs.changes.outputs.markdown == 'true'
          || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Lint POSIX shell scripts
        if: >-
          needs.changes.result != 'success'
          || needs.changes.outputs.scripts == 'true'
          || github.event_name == 'workflow_dispatch'
        # v2
        uses: >-
          step-security/action-shellcheck@93e3a10f8992244473b1c679f7736a92f197445b
        with:
          scandir: ./scripts
          version: v0.11.0
        env:
          SHELLCHECK_OPTS: --shell=sh

      - name: Lint Markdown syntax
        if: >-
          needs.changes.result != 'success'
          || needs.changes.outputs.markdown == 'true'
          || github.event_name == 'workflow_dispatch'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: '**/*.md'

      - name: Install codespell
        if: >-
          needs.changes.result != 'success'
          || needs.changes.outputs.scripts == 'true'
          || needs.changes.outputs.markdown == 'true'
          || github.event_name == 'workflow_dispatch'
        run: python -m pip install codespell==2.4.1

      - name: Check spelling in scripts and Markdown
        if: >-
          needs.changes.result != 'success'
          || needs.changes.outputs.scripts == 'true'
          || needs.changes.outputs.markdown == 'true'
          || github.event_name == 'workflow_dispatch'
        run: |
          git ls-files -z -- scripts/ '*.md' ':(exclude)collections/**' |
            xargs -0 -r codespell --check-filenames
