# .github/workflows/molecule.yml
---
name: Molecule CI

env:
  ANSIBLE_PYTHON_VERSION: '3.14'

"on":
  workflow_dispatch:
  # execute on pull request event
  pull_request:
  push:
    branches:
      - $default-branch
      - development
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Lint yaml.
        run: |
          yamllint .

      - name: Lint Ansible.
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections --force
          ansible-lint \
            --exclude collections/ansible_collections/community/openwrt/

  check-structure:
    name: Check collection structure
    runs-on: ubuntu-latest
    outputs:
      has_collection: ${{ steps.check.outputs.files_exists }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Check for galaxy.yml and tests/unit/plugins
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f galaxy.yml && -d tests/unit/plugins ]]; then
            echo "files_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_exists=false" >> "$GITHUB_OUTPUT"
          fi

  sanity:
    name: Sanity
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip install ansible-core

      - name: Ansible Sanity check
        run: |
          ansible-test sanity --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  units:
    name: Units
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip install ansible-core

      - name: Ansible Units check
        run: |
          ansible-test units --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  molecule:
    name: Molecule
    needs:
      - lint
      - sanity
      - units
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: >-
        ${{ github.workspace }}/extensions/molecule/*/molecule.yml
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
    strategy:
      fail-fast: false
      matrix:
        openwrt_version:
          - '25.12'
        scenario:
          - default
          - network-static
          - network-dhcp
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule molecule-plugins[docker] netaddr

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections --force

      - name: Versions
        run: |
          molecule --version
          pip list | grep -iE 'molecule|ansible|docker'

      - name: Configure Ansible role search path
        run: |
          echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:"\
          "$HOME/.ansible/roles:/usr/share/ansible/roles" >> "$GITHUB_ENV"

      - name: Test ${{ matrix.scenario }} scenario
        run: molecule test -s "${{ matrix.scenario }}" --destroy=never
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

      - name: Show container network diagnostics
        if: always()
        run: |
          docker ps -a
          container="openwrt-${OPENWRT_VERSION}-${{ matrix.scenario }}"
          echo "=== Docker network mode ==="
          docker inspect --format \
            'NetworkMode={{.HostConfig.NetworkMode}}' "$container" || true
          echo "=== Docker capabilities ==="
          docker inspect --format \
            'CapAdd={{json .HostConfig.CapAdd}}' "$container" || true
          echo "=== Docker networks ==="
          docker inspect --format \
            'Networks={{json .NetworkSettings.Networks}}' "$container" || true
          echo "=== Container network state ==="
          docker exec "$container" sh -c '
            echo "--- interfaces ---"
            ip addr 2>&1 || true
            echo "--- routes ---"
            ip route 2>&1 || true
            echo "--- resolver ---"
            cat /etc/resolv.conf 2>&1 || true
            echo "--- OpenWrt interfaces ---"
            ubus call network.interface dump 2>&1 || true
          ' || true
          echo "=== Container logs ==="
          docker logs "$container" || true

      - name: Destroy ${{ matrix.scenario }} scenario
        if: always()
        run: molecule destroy -s "${{ matrix.scenario }}"
