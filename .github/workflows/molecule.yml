# .github/workflows/molecule.yml
---
name: Molecule CI

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0'  # Regular OpenWrt image
    - cron: '17 7 * * 0'  # OpenWrt snapshot image
  pull_request:
  push:
    branches:
      - development
      - master

jobs:
  openwrt-versions:
    name: Read OpenWrt version matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read configured OpenWrt versions
        id: versions
        run: |
          set -euo pipefail
          versions="$(jq -ce \
            '.versions | select(type == "array" and length > 0)' \
            .github/openwrt-versions.json)"
          printf 'versions=%s\n' "$versions" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect relevant changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      molecule: ${{ steps.filter.outputs.molecule }}
    steps:
      - name: Check out code
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect relevant changed paths
        id: filter
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha
                || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Run Molecule if the base commit or diff is unavailable.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] ||
            ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "molecule=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_args=("$BASE_SHA...$HEAD_SHA")
          else
            diff_args=("$BASE_SHA" "$HEAD_SHA")
          fi

          if ! git diff --no-renames --name-only "${diff_args[@]}" \
            > "$RUNNER_TEMP/changed-files.txt"; then
            echo "molecule=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "$RUNNER_TEMP/changed-files.txt"

          # Only Markdown-only changes skip Molecule. Test everything else.
          molecule=false
          while IFS= read -r path; do
            case "$path" in
              *.md) ;;
              *) molecule=true; break ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          echo "molecule=$molecule" >> "$GITHUB_OUTPUT"


  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.
        id: python
        # v7
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Install test dependencies.
        run: |
          python -m pip install --require-hashes \
            --requirement requirements/ci/lint.txt
          python -m pip check
          ansible --version
          ansible-lint --version

      - name: Lint yaml.
        run: |
          yamllint .

      - name: Lint Ansible.
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections
          ansible-lint \
            --exclude collections/ansible_collections/community/openwrt/

  check-structure:
    name: Check collection structure
    runs-on: ubuntu-latest
    outputs:
      has_collection: ${{ steps.check.outputs.files_exists }}
    steps:
      - name: Check out the codebase.
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check for galaxy.yml and tests/unit/plugins
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f galaxy.yml && -d tests/unit/plugins ]]; then
            echo "files_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_exists=false" >> "$GITHUB_OUTPUT"
          fi

  sanity:
    name: Sanity
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.
        id: python
        # v7
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Install test dependencies.
        run: |
          python -m pip install --require-hashes \
            --requirement requirements/ci/ansible-test.txt
          python -m pip check
          ansible --version

      - name: Ansible Sanity check
        run: |
          ansible-test sanity --docker default \
            --python ${{ steps.python.outputs.python-version }}

  units:
    name: Units
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.
        id: python
        # v7
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Install test dependencies.
        run: |
          python -m pip install --require-hashes \
            --requirement requirements/ci/ansible-test.txt
          python -m pip check
          ansible --version

      - name: Ansible Units check
        run: |
          ansible-test units --docker default \
            --python ${{ steps.python.outputs.python-version }}

  molecule:
    name: Molecule tests (${{ matrix.openwrt_version }}, ${{ matrix.scenario }})
    needs:
      - changes
      - openwrt-versions
      - check-structure
      - lint
      - sanity
      - units
    if: >-
      ${{
        !cancelled()
        && needs['openwrt-versions'].result == 'success'
        && needs.check-structure.result == 'success'
        && needs.lint.result == 'success'
        && contains(fromJSON('["success","skipped"]'), needs.sanity.result)
        && contains(fromJSON('["success","skipped"]'), needs.units.result)
        && (
          needs.changes.result == 'failure'
          || (
            needs.changes.result == 'success'
            && needs.changes.outputs.molecule == 'true'
          )
          || (
            needs.changes.result == 'skipped'
            && (
              github.event_name == 'schedule'
              || github.event_name == 'workflow_dispatch'
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: >-
        ${{ github.workspace }}/extensions/molecule/*/molecule.yml
      OPENWRT_SNAPSHOT: ${{ github.event.schedule == '17 7 * * 0' }}
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
    strategy:
      fail-fast: false
      matrix:
        openwrt_version: >-
          ${{ fromJSON(needs['openwrt-versions'].outputs.versions) }}
        scenario:
          - default
          - network-static
          - network-dhcp
    steps:
      - name: Check out code
        # v7
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record setup start
        id: setup-start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        id: python
        # v7
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes \
            --requirement requirements/ci/molecule.txt
          python -m pip check

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections

      - name: Versions
        run: |
          ansible --version
          molecule --version
          python -m pip list | grep -iE 'molecule|ansible|docker'

      - name: Configure Ansible role search path
        run: |
          echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:"\
          "$HOME/.ansible/roles:/usr/share/ansible/roles" >> "$GITHUB_ENV"

      - name: Configure and pull OpenWrt image
        uses: ./.github/actions/openwrt-image
        with:
          version: ${{ matrix.openwrt_version }}
          snapshot: ${{ env.OPENWRT_SNAPSHOT }}

      - name: Record setup duration
        id: setup-duration
        env:
          STARTED_AT: ${{ steps.setup-start.outputs.started_at }}
        run: |
          echo "duration_seconds=$(($(date +%s) - STARTED_AT))" \
            >> "$GITHUB_OUTPUT"

      - name: Test ${{ matrix.scenario }} scenario
        id: molecule-test
        shell: bash
        run: |
          set +e
          started_at=$(date +%s)
          molecule test -s "${{ matrix.scenario }}" --destroy=never
          test_status=$?
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
          if [[ "$test_status" -eq 0 ]]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          exit "$test_status"
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_DISPLAY_OK_HOSTS: 'false'
          ANSIBLE_DISPLAY_SKIPPED_HOSTS: 'false'
      - name: Record tested container image
        if: always()
        run: |
          container="openwrt-${OPENWRT_VERSION}-${{ matrix.scenario }}"
          docker inspect "$container" \
            --format 'Container image ID: {{.Image}}' || true

      - name: Show container network diagnostics
        if: failure()
        run: |
          docker ps -a
          container="openwrt-${OPENWRT_VERSION}-${{ matrix.scenario }}"
          echo "=== Docker container configuration ==="
          docker inspect --format \
            'status={{.State.Status}} exit={{.State.ExitCode}}' \
            "$container" || true
          docker inspect --format \
            'image={{.Image}} network={{.HostConfig.NetworkMode}}' \
            "$container" || true
          docker inspect --format \
            'CapAdd={{json .HostConfig.CapAdd}}' "$container" || true
          docker inspect --format \
            'Networks={{json .NetworkSettings.Networks}}' "$container" || true
          echo "=== Container network state ==="
          docker exec "$container" sh -c '
            echo "--- interfaces ---"
            ip addr 2>&1 || true
            echo "--- routes ---"
            ip route 2>&1 || true
            echo "--- resolver ---"
            cat /etc/resolv.conf 2>&1 || true
            echo "--- OpenWrt release and package manager ---"
            cat /etc/openwrt_release 2>&1 || true
            opkg --version 2>&1 || true
            echo "--- Network/firewall init links ---"
            ls -l /etc/rc.d/S*network /etc/rc.d/S*dnsmasq \\
              /etc/rc.d/S*firewall /etc/rc.d/S*odhcpd 2>&1 || true
            echo "--- Firewall rules ---"
            nft list ruleset 2>&1 || iptables-save 2>&1 || true
            echo "--- Recent system log ---"
            logread 2>&1 | tail -100 || true
            echo "--- Filesystem space ---"
            df -h / /tmp 2>&1 || true
            echo "--- OpenWrt interfaces ---"
            ubus call network.interface dump 2>&1 || true
          ' || true
          echo "=== Container logs ==="
          docker logs "$container" || true

      - name: Destroy ${{ matrix.scenario }} scenario
        id: molecule-destroy
        if: always()
        shell: bash
        run: |
          set +e
          started_at=$(date +%s)
          molecule destroy -s "${{ matrix.scenario }}"
          destroy_status=$?
          ended_at=$(date +%s)
          echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
          if [[ "$destroy_status" -eq 0 ]]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          exit "$destroy_status"


      - name: Record matrix result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TEST_OUTCOME: ${{ steps.molecule-test.outcome }}
          TEST_DURATION: ${{ steps.molecule-test.outputs.duration_seconds }}
          DESTROY_OUTCOME: ${{ steps.molecule-destroy.outcome }}
          DESTROY_DURATION: >-
            ${{ steps.molecule-destroy.outputs.duration_seconds }}
          SETUP_DURATION: ${{ steps.setup-duration.outputs.duration_seconds }}
          OPENWRT_VERSION: ${{ matrix.openwrt_version }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          mkdir -p matrix-results
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          job_status = os.environ['JOB_STATUS']
          test_outcome = os.environ.get('TEST_OUTCOME', 'skipped')
          destroy_outcome = os.environ.get('DESTROY_OUTCOME', 'skipped')
          if job_status == 'cancelled':
              status = 'CANCELLED'
          elif (
              job_status == 'success'
              and test_outcome == 'success'
              and destroy_outcome == 'success'
          ):
              status = 'PASS'
          else:
              status = 'FAIL'

          data = {
              'openwrt': os.environ['OPENWRT_VERSION'],
              'scenario': os.environ['SCENARIO'],
              'status': status,
              'job_status': job_status,
              'test_outcome': test_outcome,
              'destroy_outcome': destroy_outcome,
              'setup_duration_seconds': os.environ.get('SETUP_DURATION', ''),
              'test_duration_seconds': os.environ.get('TEST_DURATION', ''),
              'destroy_duration_seconds': os.environ.get(
                  'DESTROY_DURATION', ''
              ),
          }
          filename = f"{data['openwrt']}-{data['scenario']}.json"
          Path('matrix-results', filename).write_text(
              json.dumps(data, sort_keys=True) + chr(10), encoding='utf-8'
          )
          PY

      - name: Upload matrix result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            molecule-result-${{ matrix.openwrt_version }}-
            ${{ matrix.scenario }}
          path: matrix-results/*.json
          if-no-files-found: error
          retention-days: 1
  molecule-status:
    name: Molecule
    needs:
      - changes
      - openwrt-versions
      - check-structure
      - lint
      - sanity
      - units
      - molecule
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download matrix results
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: molecule-result-*
          path: matrix-results
        continue-on-error: true

      - name: Publish matrix summary and verify results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGES_MOLECULE: ${{ needs.changes.outputs.molecule }}
          EVENT_NAME: ${{ github.event_name }}
          OPENWRT_VERSIONS: ${{ needs['openwrt-versions'].outputs.versions }}
          VERSIONS_RESULT: ${{ needs['openwrt-versions'].result }}
          STRUCTURE_RESULT: ${{ needs.check-structure.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SANITY_RESULT: ${{ needs.sanity.result }}
          UNITS_RESULT: ${{ needs.units.result }}
          MOLECULE_RESULT: ${{ needs.molecule.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          scenarios = ('default', 'network-static', 'network-dhcp')
          versions = json.loads(os.environ.get('OPENWRT_VERSIONS') or '[]')
          results = {}
          errors = []
          for path in sorted(Path('matrix-results').glob('*/*.json')):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  if not isinstance(data['openwrt'], str) or not isinstance(
                      data['scenario'], str
                  ):
                      raise ValueError(
                          'OpenWrt version and scenario must be strings'
                      )
                  key = (data['openwrt'], data['scenario'])
                  if key in results:
                      errors.append(f'Duplicate result for {key[0]} / {key[1]}')
                  if (
                      data['status'] not in ('PASS', 'FAIL', 'CANCELLED')
                      or data['job_status'] not in (
                          'success', 'failure', 'cancelled'
                      )
                      or data['test_outcome'] not in (
                          'success', 'failure', 'skipped', 'cancelled'
                      )
                      or data['destroy_outcome'] not in (
                          'success', 'failure', 'skipped', 'cancelled'
                      )
                  ):
                      errors.append(f'Malformed result: {path.name}')
                  expected_status = (
                      'CANCELLED' if data['job_status'] == 'cancelled'
                      else 'PASS' if (
                          data['job_status'] == 'success'
                          and data['test_outcome'] == 'success'
                          and data['destroy_outcome'] == 'success'
                      )
                      else 'FAIL'
                  )
                  if data['status'] != expected_status:
                      errors.append(f'Inconsistent result status: {path.name}')
                  if path.name != f'{key[0]}-{key[1]}.json':
                      errors.append(
                          'Result filename does not match its identity: '
                          + path.name
                      )
                  results[key] = data
              except (OSError, ValueError, KeyError, TypeError) as exc:
                  errors.append(f'Malformed result {path.name}: {exc}')

          prechecks = {
              'OpenWrt version matrix': os.environ['VERSIONS_RESULT'],
              'collection structure': os.environ['STRUCTURE_RESULT'],
              'lint': os.environ['LINT_RESULT'],
              'sanity': os.environ['SANITY_RESULT'],
              'units': os.environ['UNITS_RESULT'],
          }
          prechecks_ok = (
              prechecks['OpenWrt version matrix'] == 'success'
              and prechecks['collection structure'] == 'success'
              and prechecks['lint'] == 'success'
              and prechecks['sanity'] in ('success', 'skipped')
              and prechecks['units'] in ('success', 'skipped')
          )
          changes_result = os.environ['CHANGES_RESULT']
          event_name = os.environ['EVENT_NAME']
          changes_molecule = os.environ.get('CHANGES_MOLECULE', '')
          molecule_expected = prechecks_ok and (
              changes_result == 'failure'
              or (changes_result == 'success' and changes_molecule == 'true')
              or (
                  changes_result == 'skipped'
                  and event_name in ('schedule', 'workflow_dispatch')
              )
          )
          intentional_skip = (
              prechecks_ok
              and changes_result == 'success'
              and changes_molecule == 'false'
          )

          rows = []
          if molecule_expected:
              expected = {
                  (version, scenario)
                  for version in versions
                  for scenario in scenarios
              }
              for version in versions:
                  for scenario in scenarios:
                      key = (version, scenario)
                      data = results.get(key)
                      if data is None:
                          status = 'NO RESULT'
                          errors.append(
                              f'Missing result for {version} / {scenario}'
                          )
                          data = {}
                      else:
                          status = data['status']
                      rows.append({
                          'openwrt': version,
                          'scenario': scenario,
                          'status': status,
                          'setup': data.get('setup_duration_seconds') or '—',
                          'test': data.get('test_duration_seconds') or '—',
                          'destroy': (
                              data.get('destroy_duration_seconds') or '—'
                          ),
                      })
              for key in sorted(set(results) - expected):
                  errors.append(f'Unexpected result for {key[0]} / {key[1]}')
          else:
              for version, scenario in sorted(results):
                  errors.append(
                      'Unexpected artifact for skipped matrix: '
                      f'{version} / {scenario}'
                  )
              rows.append({
                  'openwrt': '—', 'scenario': 'matrix',
                  'status': 'SKIPPED' if intentional_skip else 'BLOCKED',
                  'setup': '—', 'test': '—', 'destroy': '—',
              })

          if not prechecks_ok:
              errors.extend(
                  f'{name}: {status}' for name, status in prechecks.items()
                  if status not in ('success', 'skipped')
              )
              if changes_result not in ('success', 'skipped'):
                  errors.append(f'change detection: {changes_result}')
          elif molecule_expected and os.environ['MOLECULE_RESULT'] != 'success':
              errors.append(
                  f'Molecule matrix job: {os.environ["MOLECULE_RESULT"]}'
              )
          elif (
              not molecule_expected
              and os.environ['MOLECULE_RESULT'] != 'skipped'
          ):
              errors.append(
                  'Molecule matrix should have been skipped but was '
                  + os.environ['MOLECULE_RESULT']
              )
          elif not molecule_expected and not intentional_skip and prechecks_ok:
              errors.append(
                  'Molecule matrix was skipped without an explicit '
                  'Markdown-only change result or scheduled/manual event.'
              )

          if any(
              row['status'] in ('FAIL', 'CANCELLED', 'NO RESULT', 'BLOCKED')
              for row in rows
          ):
              errors.append('One or more expected matrix entries did not pass.')
          overall = (
              'FAIL' if errors
              else 'SKIPPED' if not molecule_expected
              else 'PASS'
          )
          lines = [
              '## Molecule matrix', '', f'**Overall result: {overall}**', '',
              '| OpenWrt | Scenario | Result | Setup (s) | '
              'Test (s) | Destroy (s) |',
              '|---|---|---:|---:|---:|---:|',
          ]
          for row in rows:
              lines.append(
                  '| {openwrt} | {scenario} | {status} | {setup} | '
                  '{test} | {destroy} |'.format(**row)
              )
          if errors:
              lines.extend(['', '### Problems', ''])
              lines.extend(f'- {error}' for error in errors)
          report = '\n'.join(lines) + '\n'
          with open(
              os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8'
          ) as summary:
              summary.write(report)
          print(report)
          if errors:
              sys.exit(1)
          PY
