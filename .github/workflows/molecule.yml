# .github/workflows/molecule.yml
---
name: Molecule CI

on:
  workflow_dispatch:
  # execute on pull request event
  pull_request:
  push:
    branches:
      - $default-branch
      - development
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v6

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Lint yaml.
        run: |
          yamllint .

      - name: Lint Ansible.
        run: |
          ansible-galaxy role install geerlingguy.docker
          ansible-lint

  molecule:
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: >-
        ${{ github.workspace }}/extensions/molecule/*/molecule.yml
    strategy:
      fail-fast: false
      matrix:
        platform:
          - openwrt-24.10
          - openwrt-25.12
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule molecule-plugins[docker]

      - name: Install Ansible collection
        run: ansible-galaxy collection install community.openwrt

      - name: Run Molecule for ${{ matrix.platform }}
        run: molecule test -- --limit ${{ matrix.platform }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
