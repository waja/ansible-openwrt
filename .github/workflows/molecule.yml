# .github/workflows/molecule.yml
---
name: Molecule CI

on:
  workflow_dispatch:
  # execute on pull request event
  pull_request:
  push:
    branches:
      - $default-branch
      - development
      - master

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - openwrt-24.10
          - openwrt-25.12
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule molecule-plugins[docker]

      - name: Install Ansible collection
        run: ansible-galaxy collection install community.openwrt

      - name: Run Molecule for ${{ matrix.platform }}
        run: molecule test -- --limit ${{ matrix.platform }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'