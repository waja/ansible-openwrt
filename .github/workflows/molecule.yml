# .github/workflows/molecule.yml
---
name: Molecule CI

---
env:
  ANSIBLE_PYTHON_VERSION: '3.14'

"on":
  workflow_dispatch:
  # execute on pull request event
  pull_request:
  push:
    branches:
      - $default-branch
      - development
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Lint yaml.
        run: |
          yamllint .

      - name: Lint Ansible.
        env:
          ANSIBLE_COLLECTIONS_PATH: >-
            ${{ github.workspace }}/collections:
            /home/runner/.ansible/collections:
            /usr/share/ansible/collections
        run: |
          ansible-galaxy role install geerlingguy.docker \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install community.openwrt
          ansible-lint \
            --exclude collections/ansible_collections/community/openwrt/

  check-structure:
    name: Check collection structure
    runs-on: ubuntu-latest
    outputs:
      has_collection: ${{ steps.check.outputs.files_exists }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Check for galaxy.yml and tests/unit/plugins
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f galaxy.yml && -d tests/unit/plugins ]]; then
            echo "files_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_exists=false" >> "$GITHUB_OUTPUT"
          fi

  sanity:
    name: Sanity
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip install ansible-core

      - name: Ansible Sanity check
        run: |
          ansible-test sanity --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  units:
    name: Units
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip install ansible-core

      - name: Ansible Units check
        run: |
          ansible-test units --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  molecule:
    name: Molecule
    needs:
      - lint
      - sanity
      - units
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: >-
        ${{ github.workspace }}/extensions/molecule/*/molecule.yml
    strategy:
      fail-fast: false
      matrix:
        platform:
          - openwrt-25.12
          - openwrt-24.10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule molecule-plugins[docker]

      - name: Install Ansible collection
        run: ansible-galaxy collection install community.openwrt

      - name: Versions
        run: |
          molecule --version
          pip list | grep -iE 'molecule|ansible|docker'

      - name: Configure Ansible role search path
        run: |
          echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:$HOME/.ansible/roles:/usr/share/ansible/roles" >> "$GITHUB_ENV"

      - name: Run Molecule for ${{ matrix.platform }}
        run: molecule test --destroy=never
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

      - name: Debug containers
        if: failure()
        run: |
          docker ps -a
          docker inspect ${{ matrix.platform }} \
             --format '{{.State.Status}} exit={{.State.ExitCode}}' \
             || true
          docker inspect ${{ matrix.platform }} \
             --format 'cmd={{.Config.Cmd}} tmpfs={{.HostConfig.Tmpfs}}' \
             || true
          docker logs ${{ matrix.platform }} || true

      - name: Molecule destroy
        if: always()
        run: molecule destroy
