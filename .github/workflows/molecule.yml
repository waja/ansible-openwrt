# .github/workflows/molecule.yml
---
name: Molecule CI

env:
  ANSIBLE_PYTHON_VERSION: '3.14'

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 0' # Regular OpenWrt image
    - cron: '17 7 * * 0' # OpenWrt snapshot image
  # execute on pull request event
  pull_request:
  push:
    branches:
      - $default-branch
      - development
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: |
          python -m pip install --require-hashes \
            --requirement .github/workflows/requirements-lint.txt
          python -m pip check
          ansible --version
          ansible-lint --version

      - name: Lint yaml.
        run: |
          yamllint .

      - name: Lint Ansible.
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections --force
          ansible-lint \
            --exclude collections/ansible_collections/community/openwrt/

  check-structure:
    name: Check collection structure
    runs-on: ubuntu-latest
    outputs:
      has_collection: ${{ steps.check.outputs.files_exists }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Check for galaxy.yml and tests/unit/plugins
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f galaxy.yml && -d tests/unit/plugins ]]; then
            echo "files_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_exists=false" >> "$GITHUB_OUTPUT"
          fi

  sanity:
    name: Sanity
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: |
          python -m pip install --require-hashes \
            --requirement .github/workflows/requirements-ansible-test.txt
          python -m pip check
          ansible --version

      - name: Ansible Sanity check
        run: |
          ansible-test sanity --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  units:
    name: Units
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: |
          python -m pip install \
            --requirement .github/workflows/requirements-ci.txt
          python -m pip check
          ansible --version

      - name: Ansible Units check
        run: |
          ansible-test units --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  script-tests:
    name: State discovery script smoke test (OpenWrt 25.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check shell syntax and command-line behavior
        run: |
          docker run --rm \
            -v "$PWD/scripts/owrt-extra.sh:/tmp/owrt-extra.sh:ro" \
            --entrypoint /bin/sh openwrt/rootfs:x86_64-openwrt-25.12 \
            -c '
              set -eu
              sh -n /tmp/owrt-extra.sh

              sh /tmp/owrt-extra.sh -h > /tmp/help.txt
              grep -q "owrt-extra.sh" /tmp/help.txt

              if sh /tmp/owrt-extra.sh --invalid > /tmp/invalid.txt 2>&1; then
                echo "Expected an unknown option to fail." >&2
                exit 1
              fi
              grep -q "Unknown option: --invalid" /tmp/invalid.txt
            '

  molecule:
    name: Molecule
    needs:
      - lint
      - sanity
      - units
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: >-
        ${{ github.workspace }}/extensions/molecule/*/molecule.yml
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
      OPENWRT_SNAPSHOT: ${{ github.event.schedule == '17 7 * * 0' }}
      OPENWRT_IMAGE: >-
        ${{ github.event.schedule == '17 7 * * 0'
            && format('openwrt/rootfs:x86_64-{0}-SNAPSHOT',
                      matrix.openwrt_version)
            || format('openwrt/rootfs:x86_64-openwrt-{0}',
                      matrix.openwrt_version) }}
    strategy:
      fail-fast: false
      matrix:
        openwrt_version:
          - '25.12'
        scenario:
          - default
          - network-static
          - network-dhcp
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes \
            --requirement .github/workflows/requirements-molecule.txt
          python -m pip check

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections --force

      - name: Versions
        run: |
          ansible --version
          molecule --version
          python -m pip list | grep -iE 'molecule|ansible|docker'

      - name: Configure Ansible role search path
        run: |
          echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:"\
          "$HOME/.ansible/roles:/usr/share/ansible/roles" >> "$GITHUB_ENV"

      - name: Pull and identify OpenWrt image
        run: |
          set -euo pipefail
          echo "Selected image: $OPENWRT_IMAGE"
          docker pull "$OPENWRT_IMAGE"
          docker image inspect "$OPENWRT_IMAGE" \
            --format 'Image ID: {{.Id}}'
          docker image inspect "$OPENWRT_IMAGE" \
            --format 'Repo digests: {{json .RepoDigests}}'

      - name: Test ${{ matrix.scenario }} scenario
        run: molecule test -s "${{ matrix.scenario }}" --destroy=never
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

      - name: Record tested container image
        if: always()
        run: |
          container="openwrt-${OPENWRT_VERSION}-${{ matrix.scenario }}"
          docker inspect "$container" \
            --format 'Container image ID: {{.Image}}' || true

      - name: Show container network diagnostics
        if: failure()
        run: |
          docker ps -a
          container="openwrt-${OPENWRT_VERSION}-${{ matrix.scenario }}"
          echo "=== Docker container configuration ==="
          docker inspect --format \
            'status={{.State.Status}} exit={{.State.ExitCode}}' \
            "$container" || true
          docker inspect --format \
            'image={{.Image}} network={{.HostConfig.NetworkMode}}' \
            "$container" || true
          docker inspect --format \
            'CapAdd={{json .HostConfig.CapAdd}}' "$container" || true
          docker inspect --format \
            'Networks={{json .NetworkSettings.Networks}}' "$container" || true
          echo "=== Container network state ==="
          docker exec "$container" sh -c '
            echo "--- interfaces ---"
            ip addr 2>&1 || true
            echo "--- routes ---"
            ip route 2>&1 || true
            echo "--- resolver ---"
            cat /etc/resolv.conf 2>&1 || true
            echo "--- OpenWrt release and package manager ---"
            cat /etc/openwrt_release 2>&1 || true
            opkg --version 2>&1 || true
            echo "--- Network/firewall init links ---"
            ls -l /etc/rc.d/S*network /etc/rc.d/S*dnsmasq \\
              /etc/rc.d/S*firewall /etc/rc.d/S*odhcpd 2>&1 || true
            echo "--- Firewall rules ---"
            nft list ruleset 2>&1 || iptables-save 2>&1 || true
            echo "--- Recent system log ---"
            logread 2>&1 | tail -100 || true
            echo "--- Filesystem space ---"
            df -h / /tmp 2>&1 || true
            echo "--- OpenWrt interfaces ---"
            ubus call network.interface dump 2>&1 || true
          ' || true
          echo "=== Container logs ==="
          docker logs "$container" || true

      - name: Destroy ${{ matrix.scenario }} scenario
        if: always()
        run: molecule destroy -s "${{ matrix.scenario }}"
