# .github/workflows/molecule.yml
---
name: Molecule CI

env:
  ANSIBLE_PYTHON_VERSION: '3.14'

"on":
  workflow_dispatch:
  # execute on pull request event
  pull_request:
  push:
    branches:
      - $default-branch
      - development
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Lint yaml.
        run: |
          yamllint .

      - name: Lint Ansible.
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections
          ansible-lint \
            --exclude collections/ansible_collections/community/openwrt/

  check-structure:
    name: Check collection structure
    runs-on: ubuntu-latest
    outputs:
      has_collection: ${{ steps.check.outputs.files_exists }}
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Check for galaxy.yml and tests/unit/plugins
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f galaxy.yml && -d tests/unit/plugins ]]; then
            echo "files_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_exists=false" >> "$GITHUB_OUTPUT"
          fi

  sanity:
    name: Sanity
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip install ansible-core

      - name: Ansible Sanity check
        run: |
          ansible-test sanity --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  units:
    name: Units
    needs:
      - lint
      - check-structure
    if: needs.check-structure.outputs.has_collection == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v7

      - name: Set up Python 3.
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install test dependencies.
        run: pip install ansible-core

      - name: Ansible Units check
        run: |
          ansible-test units --docker default \
            --python ${{ env.ANSIBLE_PYTHON_VERSION }}

  molecule:
    name: Molecule
    needs:
      - lint
      - sanity
      - units
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      MOLECULE_GLOB: >-
        ${{ github.workspace }}/extensions/molecule/*/molecule.yml
    strategy:
      fail-fast: false
      matrix:
        platform:
          - openwrt-25.12
          - openwrt-24.10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.ANSIBLE_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule molecule-plugins[docker]

      - name: Install Ansible dependencies
        run: |
          ansible-galaxy role install -r requirements.yml \
            --roles-path ~/.ansible/roles
          ansible-galaxy collection install -r requirements.yml \
            --collections-path ~/.ansible/collections

      - name: Versions
        run: |
          molecule --version
          pip list | grep -iE 'molecule|ansible|docker'

      - name: Configure Ansible role search path
        run: |
          echo "ANSIBLE_ROLES_PATH=$GITHUB_WORKSPACE/roles:"\
          "$HOME/.ansible/roles:/usr/share/ansible/roles" >> "$GITHUB_ENV"

      - name: Run Molecule for ${{ matrix.platform }}
        run: >-
          molecule test --destroy=never
          --platform-name "${{ matrix.platform }}"
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

      - name: Debug containers
        if: failure()
        run: |
          docker ps -a
          docker inspect ${{ matrix.platform }} \
            --format 'status={{.State.Status}} exit={{.State.ExitCode}}'
          docker inspect ${{ matrix.platform }} \
            --format 'cmd={{.Config.Cmd}} network={{.HostConfig.NetworkMode}}'
          docker inspect ${{ matrix.platform }} \
            --format 'privileged={{.HostConfig.Privileged}}'
          docker inspect ${{ matrix.platform }} \
            --format 'security={{json .HostConfig.SecurityOpt}}'
          docker inspect ${{ matrix.platform }} \
            --format 'tmpfs={{json .HostConfig.Tmpfs}}'
          docker inspect ${{ matrix.platform }} \
            --format 'networks={{json .NetworkSettings.Networks}}'
          docker logs ${{ matrix.platform }} || true
          if [[ "${{ matrix.platform }}" == "openwrt-24.10" ]]; then
            docker exec "${{ matrix.platform }}" sh -c '
              echo "=== OpenWrt release and package manager ==="
              cat /etc/openwrt_release || true
              opkg --version || true

              echo "=== Network interfaces, routes and DNS ==="
              ip -details addr show || true
              ip route show table all || true
              cat /etc/resolv.conf || true
              echo "=== Network/firewall init links ==="
              ls -l /etc/rc.d/S*network /etc/rc.d/S*dnsmasq \
                /etc/rc.d/S*firewall /etc/rc.d/S*odhcpd 2>&1 || true
              echo "=== Firewall rules ==="
              nft list ruleset 2>&1 || iptables-save 2>&1 || true
              echo "=== Socket/connectivity test ==="
              url='https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/'
              url="${url}packages/Packages.gz"
              wget -O /tmp/opkg-test.gz "$url" 2>&1 || true

              echo "=== Package status ==="
              opkg status snmpd snmpd-nossl libnetsnmp-nossl \
                libpci libpcre2 || true

              echo "=== Package maintainer scripts ==="
              for script in \
                /usr/lib/opkg/info/snmpd.postinst \
                /usr/lib/opkg/info/snmpd-nossl.postinst \
                /usr/lib/opkg/info/libnetsnmp-nossl.postinst \
                /usr/lib/opkg/info/libpci.postinst \
                /usr/lib/opkg/info/libpcre2.postinst; do
                if [ -f "$script" ]; then
                  echo "--- $script"
                  cat "$script"
                fi
              done

              echo "=== Recent system log ==="
              logread 2>&1 | tail -100 || true

              echo "=== Filesystem space ==="
              df -h / /tmp || true
            ' || true
          fi

      - name: Molecule destroy
        if: always()
        run: molecule destroy
