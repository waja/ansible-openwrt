# .github/workflows/refresh-ci-lockfiles.yml
---
name: Refresh CI dependency locks

"on":
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-ci-lockfiles
  cancel-in-progress: false

jobs:
  refresh-locks:
    name: Refresh generated dependency locks
    runs-on: ubuntu-latest
    steps:
      - name: Check out development.
        uses: >-
          actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: development

      - name: Set up Python 3.
        uses: >-
          actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Install the pinned lockfile generator.
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement requirements/ci/pip-tools.in

      - name: Regenerate all CI dependency locks.
        run: |
          bash scripts/update-ci-lockfiles.sh

      - name: Create or update the lockfile maintenance PR.
        uses: >-
          peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: development
          branch: automation/update-ci-lockfiles
          delete-branch: true
          add-paths: requirements/ci/*.txt
          commit-message: "ci: refresh Python dependency locks"
          title: "ci: refresh Python dependency locks"
          body: |
            Refresh the generated, hash-locked CI dependency files using
            the pinned pip-tools version.

            This updates transitive dependencies that are not proposed
            individually by Renovate. The regular lockfile validation
            workflow checks the generated files.
